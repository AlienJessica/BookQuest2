<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="BookQuest: free interactive study books for Class 4 and Class 10, with story chapters, games, practice tests and virtual science labs.">
<title>BookQuest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=Mukta:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a bright textbook you can play. White pages, red headings, sunny-yellow highlighter, chunky comic outlines with hard offset shadows. One light look on purpose, like a printed book. */
:root{
  --page:#ffffff; --paper:#f7f5f0; --sheet:#ffffff; --wash:#fff4c7; --wash2:#ffe6e1;
  --ink:#1f1a17; --muted:#6a625b; --line:#e7e0d6; --rule:#f1ece4;
  --red:#e3242b; --yellow:#ffcc29; --orange:#ff8a1e; --blue:#2563d9; --purple:#8b4fd6;
  --pen:#e3242b; --pen-soft:#ffe6e1; --on:#ffffff; --mark:#ffe36e; --signal:#ff8a1e; --void:#ffffff;
  --good:#1e9e57; --good-soft:#dcf5e6; --bad:#d92b2b; --bad-soft:#ffe1df; --water:#cfe8ff;
  --sci:#e3242b; --math:#2563d9; --sst:#ef7d00; --eng:#8b4fd6; --hin:#d6246f;
  --sh:4px 4px 0 var(--ink); --sh-sm:3px 3px 0 var(--ink);
  --f-display:"Baloo 2","Mukta",system-ui,sans-serif;
  --f-body:"Mukta","Baloo 2",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --f-hi:"Mukta","Baloo 2",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--page);color:var(--ink);font:18px/1.6 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--red)}
a{color:var(--blue)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.wrap{max-width:1060px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.12;text-wrap:balance;margin:0;font-weight:800}
.hi{font-family:var(--f-hi)}
mark{background:linear-gradient(100deg,transparent 0 1%,var(--mark) 1% 98%,transparent 98%);color:inherit;padding:0 .15em;border-radius:4px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--red);border-bottom:3px solid var(--ink)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:8px;min-height:58px}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;color:#fff;font:800 1.45rem/1 var(--f-display);white-space:nowrap}
.brand b{background:var(--yellow);color:var(--ink);border:2.5px solid var(--ink);border-radius:10px;padding:3px 8px 0;box-shadow:2px 2px 0 var(--ink);transform:rotate(-4deg)}
.crumbs{font-size:.95rem;color:#ffe3e1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:#fff;text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.toplink,.sndbtn{font:700 .88rem/1.2 var(--f-display);text-decoration:none;white-space:nowrap;border:2.5px solid var(--ink);background:#fff;color:var(--ink);padding:5px 11px 3px;border-radius:10px;box-shadow:2px 2px 0 var(--ink);cursor:pointer}
.sndbtn[aria-pressed="false"]{background:#efebe5;color:var(--muted)}
main{padding-block:28px 72px}
.eyebrow{font:700 .8rem/1.2 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--red)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--ink);background:var(--yellow);color:var(--ink);padding:8px 18px 6px;border-radius:12px;font:700 1rem/1.2 var(--f-display);cursor:pointer;text-decoration:none;box-shadow:var(--sh-sm);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.ghost{background:#fff}
.btn.red{background:var(--red);color:#fff}
.btn.big{padding:11px 22px 9px;font-size:1.1rem}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:var(--sh-sm)}
.btn.ready{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translate(0,0)}50%{transform:translate(4px,0)}}
.linkbtn{border:0;background:none;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:.95rem}

/* home */
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:30px;align-items:center;margin-bottom:38px}
.hero h1{font-size:clamp(2.2rem,5vw,3.5rem);margin-top:10px}
.hero p{color:var(--muted);max-width:50ch;margin:14px 0 18px;font-size:1.1rem}
.cta{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.hero-art{border:3px solid var(--ink);border-radius:22px;box-shadow:6px 6px 0 var(--ink);overflow:hidden;background:var(--yellow);transform:rotate(1deg)}
.hero-art svg{display:block;width:100%;height:auto}
.stat{display:grid;gap:8px;margin-top:22px;max-width:420px}
.stat .num{font:800 1.6rem/1 var(--f-display)}
.bar{height:12px;background:#fff;border:2px solid var(--ink);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red);transition:width .4s}
.sect{font-size:1.7rem;margin:0 0 16px}
.subjects{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:18px}
.subj{display:flex;flex-direction:column;border:3px solid var(--ink);border-radius:16px;background:#fff;text-decoration:none;color:var(--ink);box-shadow:var(--sh);overflow:hidden;transition:transform .12s,box-shadow .12s}
.subj:hover{transform:translate(-2px,-3px) rotate(-.6deg);box-shadow:7px 7px 0 var(--ink)}
.cover{background:var(--c);color:#fff;padding:14px 16px;min-height:136px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;position:relative;border-bottom:3px solid var(--ink)}
.cover svg{width:58px;height:58px}
.cover h2{font-size:1.5rem;color:#fff}
.cover .hi{position:absolute;right:14px;top:12px;font-weight:700}
.subj .body{padding:12px 16px 16px;display:grid;gap:6px}
.subj .meta{font-size:.95rem;color:var(--muted);line-height:1.35}
.subj .bar i{background:var(--c)}
.note{margin-top:30px;font-size:.93rem;color:var(--muted);max-width:72ch}

/* subject page */
.glyph{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--c);border:2.5px solid var(--ink);box-shadow:2px 2px 0 var(--ink);flex:none;color:#fff;font:800 1rem var(--f-display)}
.glyph svg{width:70%;height:70%}
.glyph.sm{width:42px;height:42px;border-radius:10px}
.shead{display:flex;flex-wrap:wrap;gap:18px;align-items:center;margin-bottom:22px}
.shead .glyph{width:78px;height:78px}
.shead h1{font-size:clamp(2rem,4.5vw,2.8rem)}
.book{margin-top:28px}
.book h2{font-size:1.3rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.book h2 span{font:500 .95rem var(--f-body);color:var(--muted)}
.chlist{list-style:none;margin:0;padding:0;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:#fff;box-shadow:var(--sh)}
.chlist li+li{border-top:2px dashed var(--line)}
.chrow{display:grid;grid-template-columns:2.6rem 1fr auto;gap:14px;align-items:center;padding:11px 16px;text-decoration:none;color:var(--ink)}
a.chrow:hover{background:var(--wash)}
.chrow .n{width:2.3rem;height:2.3rem;border-radius:50%;display:grid;place-items:center;font:800 .95rem/1 var(--f-display);background:var(--c);color:#fff;border:2px solid var(--ink)}
.chrow.soon .n{background:#fff;color:var(--muted);border-color:var(--line)}
.chrow .t{min-width:0;font-weight:600}
.chrow.soon{color:var(--muted)}
.chrow.soon .t{font-weight:400}
.pill{font:700 .76rem/1 var(--f-display);letter-spacing:.03em;padding:6px 10px 4px;border-radius:99px;white-space:nowrap;border:2px solid var(--ink)}
.pill.live{background:var(--yellow)}
.pill.story{background:var(--red);color:#fff}
.pill.done{background:var(--good);color:#fff}
.pill.soon{background:#fff;color:var(--muted);border-color:var(--line)}

/* chapter */
.chead{margin-bottom:16px}
.chead h1{font-size:clamp(1.9rem,4.4vw,2.8rem);margin-top:6px}
.chead .sub{color:var(--muted);margin:4px 0 0;font:600 1.1rem var(--f-display)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.tab{border:2.5px solid var(--ink);background:#fff;padding:6px 16px 4px;cursor:pointer;color:var(--ink);font:700 1rem var(--f-display);border-radius:999px;box-shadow:2px 2px 0 var(--ink)}
.tab[aria-selected="true"]{background:var(--yellow)}
.tab:hover{background:var(--wash)}

/* revise notes */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:32px;align-items:start}
.toc{position:sticky;top:calc(env(safe-area-inset-top,0px) + 80px);font-size:.95rem;display:grid;gap:4px;border:2.5px solid var(--ink);border-radius:14px;padding:12px;background:var(--wash);box-shadow:var(--sh-sm)}
.toc a{color:var(--ink);text-decoration:none;padding:3px 6px;border-radius:6px}
.toc a:hover{background:#fff}
.notes{max-width:68ch}
.notes section{padding-bottom:12px;margin-bottom:24px;border-bottom:2px dashed var(--line)}
.notes h2{font-size:1.55rem;margin-bottom:8px;color:var(--red);scroll-margin-top:90px}
.notes p,.notes li{margin:.5em 0}
.notes ul{padding-left:1.25em}
.eq{font-family:var(--f-mono);font-size:.95rem;background:#fff;border:2px solid var(--ink);border-radius:10px;padding:10px 14px;margin:.4em 0;overflow-x:auto;white-space:nowrap}
.tip{background:var(--wash);border:2px dashed var(--ink);border-radius:12px;padding:10px 14px;margin:.8em 0}
.tip b{font:800 .78rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--red);display:block}
.tbl{overflow-x:auto;margin:.8em 0}
table{border-collapse:collapse;font-size:.95rem;min-width:100%;background:#fff}
th,td{border:2px solid var(--ink);padding:6px 10px;text-align:left}
th{background:var(--wash);font-family:var(--f-display)}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.donebar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}

/* test */
.quiz{max-width:72ch;display:grid;gap:16px}
.q{background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:16px 18px;box-shadow:var(--sh-sm)}
.q h3{font:700 1.1rem/1.4 var(--f-body);margin-bottom:10px;display:flex;gap:10px}
.q h3 span{font:800 .95rem/1.5 var(--f-display);color:#fff;background:var(--red);border-radius:8px;padding:0 8px;height:fit-content}
.opts{display:grid;gap:8px}
.opt{text-align:left;border:2px solid var(--ink);background:#fff;padding:9px 12px;border-radius:12px;cursor:pointer;font-size:1rem}
.opt:hover:not(:disabled){background:var(--wash)}
.opt:disabled{cursor:default}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.why{margin-top:10px;font-size:1rem;color:var(--muted)}
.score{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);background:#fff;border:2.5px solid var(--ink);border-radius:16px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:var(--sh)}
.score .num{font:800 1.5rem var(--f-display)}
.ok{color:var(--good);font-weight:700}
.no{color:var(--bad);font-weight:700}

/* labs and pictures */
.lab{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:20px;display:grid;gap:16px;box-shadow:var(--sh)}
.lab h3{font-size:1.4rem}
.lab p{margin:0;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.ctrl{display:grid;gap:4px;min-width:min(220px,100%);flex:1}
.ctrl label{font:700 .9rem var(--f-display);color:var(--muted)}
.ctrl output{font-family:var(--f-mono);color:var(--ink)}
input[type=range]{width:100%;accent-color:var(--red)}
input[type=number]{width:6.5em;padding:6px 8px;border:2px solid var(--ink);border-radius:8px;background:#fff;color:var(--ink);font:inherit;font-family:var(--f-mono)}
.readouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.ro{background:var(--wash);border:2px solid var(--ink);border-radius:12px;padding:8px 12px}
.ro span{display:block;font:700 .72rem var(--f-display);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.ro b{font:800 1.35rem var(--f-display)}
.svgbox{overflow-x:auto}
.svgbox svg{display:block;max-width:100%;height:auto;margin:0 auto}
.chipset{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:700 .9rem/1.3 var(--f-display);padding:4px 11px 2px;border-radius:999px;background:#fff;border:2px solid var(--ink);cursor:pointer;color:var(--ink)}
.chip.on{background:var(--c,var(--red));color:#fff}
.chip:disabled{opacity:.6;cursor:default}
.eqline{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:1.1rem}
.step{display:inline-flex;align-items:center;border:2px solid var(--ink);border-radius:10px;overflow:hidden;background:#fff}
.step button{border:0;background:var(--wash);width:34px;height:36px;cursor:pointer;font-weight:800;color:var(--ink)}
.step b{min-width:1.6em;text-align:center}
.formula sub{font-size:.7em}
.sortitem{display:grid;gap:8px;padding:12px;border:2px solid var(--ink);border-radius:14px;background:#fff}
.sortitem.right{border-color:var(--good);background:var(--good-soft)}
.sortitem.wrong{border-color:var(--bad);background:var(--bad-soft)}
.evt{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:10px 12px;border-radius:12px;border:2px solid var(--ink);background:#fff;cursor:pointer}
.evt .yr{font:800 .95rem var(--f-display);min-width:4.2em;color:var(--red)}
.evt.placed{background:var(--good-soft);border-color:var(--good);cursor:default}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.flow{stroke-dasharray:6 10;animation:flow linear infinite}
@keyframes flow{to{stroke-dashoffset:-32}}
.pics{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.pin{cursor:pointer}
.pin circle{fill:#fff;stroke:var(--ink);stroke-width:2.5}
.pin text{fill:var(--ink);font:800 11px var(--f-display);pointer-events:none}
.pin:hover circle,.pin:focus circle{fill:var(--yellow)}
.pin.on circle{fill:var(--red)} .pin.on text{fill:#fff}
.pin.found circle{fill:var(--good)} .pin.found text{fill:#fff}
.pin.miss circle{fill:var(--bad)}
.pin:focus{outline:none}
.info{background:var(--wash);border:2px solid var(--ink);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.info h4{font-size:1.3rem}
.labels{display:flex;flex-wrap:wrap;gap:6px}
.labels button{font-size:.88rem;border:2px solid var(--ink);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer}
.labels button.on{background:var(--red);color:#fff}
.seg{display:inline-flex;border:2.5px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 14px 4px;cursor:pointer;font:700 1rem var(--f-display)}
.seg button+button{border-left:2.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--yellow)}
.dl{display:inline-flex;flex-wrap:wrap;gap:8px;margin-left:auto}
.dl a{font:700 .85rem/1.3 var(--f-display);text-decoration:none;border:2px solid var(--ink);background:#fff;padding:3px 10px 1px;border-radius:999px;color:var(--ink);box-shadow:2px 2px 0 var(--ink)}
.dl a:hover{background:var(--yellow)}
.booksgrid{display:grid;gap:24px}
.bk{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:14px 16px}
.bk .code{font:600 .75rem var(--f-mono);color:var(--muted)}
.empty{background:#fff;border:2px dashed var(--line);border-radius:14px;padding:24px;color:var(--muted)}

/* explore mode (chapters not yet turned into stories) */
.hud{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:22px;display:grid;gap:18px;box-shadow:var(--sh)}
.hud .mt{font-size:clamp(1.6rem,3.6vw,2.3rem);margin-top:4px}
.comms{display:flex;gap:12px;align-items:flex-end}
.comms .say{position:relative;background:#fff6c4;border:2.5px solid var(--ink);border-radius:18px;padding:8px 14px 6px;flex:1;min-width:0}
.comms .say::after{content:"";position:absolute;bottom:12px;left:-10px;width:14px;height:14px;background:inherit;border-left:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:rotate(45deg)}
.comms .nm{display:block;font:800 .72rem var(--f-display);letter-spacing:.06em;text-transform:uppercase;color:var(--red)}
.comms p{margin:0;font:600 1.06rem/1.45 var(--f-display);min-height:1.5em}
.ai{width:58px;height:58px;flex:none;border:2.5px solid var(--ink);border-radius:50%;overflow:hidden}
.ai svg{width:100%;height:100%;display:block}
.typing::after{content:"▌";color:var(--red);animation:blink .8s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.sectors{list-style:none;margin:0;padding:0;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.sectors li{display:flex;gap:10px;align-items:center;padding:10px 12px;border:2px solid var(--ink);border-radius:12px;background:var(--wash)}
.sectors span{font:800 .85rem/1.6 var(--f-display);color:#fff;background:var(--red);border-radius:8px;padding:0 7px;min-width:2em;text-align:center}
.route{display:flex;align-items:center;margin:0 4px 16px}
.route b{flex:1;height:3px;background:var(--ink)}
.node i{display:block;width:18px;height:18px;border-radius:50%;border:2.5px solid var(--ink);background:#fff}
.node.past i{background:var(--red)}
.node.here i{background:var(--yellow);transform:scale(1.3)}
.log{max-width:none}
.sig{font:inherit;color:transparent;background:repeating-linear-gradient(-45deg,var(--yellow) 0 8px,#ffdd66 8px 16px);border:2px solid var(--ink);border-radius:6px;padding:0 .35em;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.sig:hover{transform:rotate(-2deg)}
.sig.scanned{color:var(--ink);background:var(--mark);border-color:transparent;box-shadow:none;cursor:default;animation:peel .35s ease-out}
@keyframes peel{0%{transform:scale(1.15) rotate(-3deg)}100%{transform:none}}
.hudbar{display:flex;flex-wrap:wrap;gap:14px;align-items:center;border-top:2px dashed var(--line);padding-top:14px}
.meter{font:700 .98rem var(--f-display);color:var(--muted)}
.meter b{color:var(--red)}
.checkpoint{border:2.5px solid var(--ink);border-radius:16px;padding:16px;background:var(--wash);display:grid;gap:12px}
.checkpoint h3{font:700 1.12rem/1.4 var(--f-body)}

/* page turn */
.turn-out{animation:turnOut .25s ease-in forwards;transform-origin:left center}
.turn-in{animation:turnIn .34s ease-out;transform-origin:right center}
@keyframes turnOut{to{transform:perspective(1400px) rotateY(-16deg) translateX(-30px);opacity:0}}
@keyframes turnIn{from{transform:perspective(1400px) rotateY(14deg) translateX(30px);opacity:0}}

/* story episodes */
.ep{display:grid;gap:16px}
.ep-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.ep-prog{display:flex;gap:5px;flex:1;min-width:220px}
.seg-dot{flex:1;min-width:12px;height:14px;padding:0;border:2px solid var(--ink);border-radius:99px;background:#fff;cursor:pointer}
.seg-dot.done{background:var(--red)}
.seg-dot.here{background:var(--yellow)}
.ep-stars{font:800 1.1rem/1 var(--f-display);display:flex;align-items:center;gap:6px;border:2.5px solid var(--ink);border-radius:999px;padding:5px 12px 3px 8px;background:#fff;box-shadow:2px 2px 0 var(--ink)}
.ep-stars svg{width:24px;height:24px}
.ep-page{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.ep-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:3px solid var(--ink);background:var(--wash)}
.ep-head h2{font-size:clamp(1.4rem,3.4vw,2rem)}
.kind{font:800 .75rem/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px 4px;border-radius:8px;border:2px solid var(--ink);color:#fff;transform:rotate(-3deg)}

/* ---------------- Chapter content ---------------- */
const C = {};

C['sci-1'] = {
 notes:[
  {h:'What is a chemical reaction?', b:`<p>In a chemical reaction, substances (<mark>reactants</mark>) change into new substances (<mark>products</mark>) with different properties. You can usually tell a reaction has happened by one of these signs:</p>
   <ul><li>change in state</li><li>change in colour</li><li>evolution of a gas</li><li>change in temperature</li><li>formation of a precipitate</li></ul>
   <p>Example: magnesium ribbon burns with a dazzling white flame and turns into a white powder, magnesium oxide.</p>
   <div class="eq">2Mg(s) + O₂(g) → 2MgO(s)</div>`},
  {h:'Balanced chemical equations', b:`<p>Mass is neither created nor destroyed in a reaction (<mark>law of conservation of mass</mark>). So the number of atoms of each element must be the same on both sides of the equation.</p>
   <div class="eq">Skeletal: Fe + H₂O → Fe₃O₄ + H₂<br>Balanced: 3Fe(s) + 4H₂O(g) → Fe₃O₄(s) + 4H₂(g)</div>
   <p>State symbols: (s) solid, (l) liquid, (g) gas, (aq) aqueous solution. Conditions such as heat or a catalyst are written above or below the arrow.</p>
   <div class="tip"><b>Exam tip</b>Balance by changing coefficients (the big numbers in front), never the subscripts inside a formula. Try it in the “Try it” tab.</div>`},
  {h:'Types of chemical reactions', b:`<div class="tbl"><table><tr><th>Type</th><th>What happens</th><th>Example</th></tr>
   <tr><td>Combination</td><td>Two or more reactants form one product</td><td>CaO + H₂O → Ca(OH)₂ + heat (slaked lime, used for whitewashing)</td></tr>
   <tr><td>Decomposition</td><td>One reactant breaks into simpler products, using heat, electricity or light</td><td>CaCO₃ → CaO + CO₂ (heat)<br>2H₂O → 2H₂ + O₂ (electricity)<br>2AgCl → 2Ag + Cl₂ (sunlight)</td></tr>
   <tr><td>Displacement</td><td>A more reactive element displaces a less reactive one from its compound</td><td>Fe + CuSO₄ → FeSO₄ + Cu (blue colour fades, iron nail turns brown)</td></tr>
   <tr><td>Double displacement</td><td>Two compounds exchange ions; often a precipitate forms</td><td>Na₂SO₄ + BaCl₂ → BaSO₄↓ + 2NaCl (white precipitate)</td></tr>
   <tr><td>Redox</td><td>One substance is oxidised while another is reduced</td><td>CuO + H₂ → Cu + H₂O</td></tr></table></div>
   <p><mark>Oxidation</mark> = gain of oxygen or loss of hydrogen. <mark>Reduction</mark> = loss of oxygen or gain of hydrogen. In CuO + H₂ → Cu + H₂O, CuO is reduced and H₂ is oxidised.</p>`},
  {h:'Exothermic and endothermic', b:`<p><mark>Exothermic</mark> reactions release heat: burning of natural gas, respiration, quicklime with water. <mark>Endothermic</mark> reactions absorb heat: most decomposition reactions, such as heating calcium carbonate.</p>
   <div class="tip"><b>Remember</b>Respiration is exothermic. Glucose is oxidised in our cells and the energy released keeps us alive.</div>`},
  {h:'Corrosion and rancidity', b:`<p><mark>Corrosion</mark> is the slow damage of a metal by air, moisture or acids. Iron gets a reddish-brown coat of rust, silver gets a black coat (silver sulphide), copper gets a green coat (basic copper carbonate). Painting, oiling and galvanising protect metals.</p>
   <p><mark>Rancidity</mark> is the oxidation of fats and oils in food, which changes their smell and taste. It is slowed by adding antioxidants, storing food in airtight containers and refrigerating it. Chips packets are flushed with nitrogen so the chips are not oxidised.</p>`}
 ],

  ['Fe + CuSO₄ → FeSO₄ + Cu is which type of reaction?',['Combination','Decomposition','Displacement','Double displacement'],2,'Iron is more reactive than copper, so it displaces copper from copper sulphate.'],
  ['2AgCl → 2Ag + Cl₂ takes place in sunlight. It is a…',['Combination reaction','Decomposition reaction','Displacement reaction','Neutralisation reaction'],1,'One reactant breaks into two products using light: photolytic decomposition.'],
  ['In CuO + H₂ → Cu + H₂O, which substance is oxidised?',['CuO','H₂','Cu','H₂O'],1,'Hydrogen gains oxygen to become water, so H₂ is oxidised.'],
  ['Chips packets are flushed with which gas to prevent rancidity?',['Oxygen','Hydrogen','Nitrogen','Carbon dioxide'],2,'Nitrogen is unreactive, so it keeps the oil in the chips from oxidising.'],
  ['The white precipitate formed when Na₂SO₄ reacts with BaCl₂ is…',['NaCl','BaSO₄','BaCl₂','Na₂SO₄'],1,'Barium sulphate is insoluble in water.'],

C['sci-11'] = {
 notes:[
  {h:'Charge and current', b:`<p><mark>Electric current</mark> is the rate of flow of charge: <span class="eq" style="display:inline-block;margin:0;padding:2px 8px">I = Q / t</span></p>
   <p>The SI unit of charge is the coulomb (C). One coulomb is the charge of nearly 6 × 10¹⁸ electrons; one electron carries 1.6 × 10⁻¹⁹ C. Current is measured in amperes (A) with an <mark>ammeter</mark> connected in <b>series</b>. Conventional current flows opposite to the flow of electrons.</p>`},
  {h:'Potential difference', b:`<p>Potential difference is the work done to move a unit charge from one point to another: <b>V = W / Q</b>. Its unit is the volt (V); 1 V = 1 J/C. It is measured with a <mark>voltmeter</mark> connected in <b>parallel</b>.</p>`},
  {h:"Ohm's law and resistance", b:`<p>At constant temperature, the current through a conductor is directly proportional to the potential difference across it.</p>
   <div class="eq">V = I × R &nbsp;&nbsp;→&nbsp;&nbsp; R = V / I</div>
   <p>Resistance R is measured in ohms (Ω). It depends on the length (l), area of cross-section (A) and material of the conductor:</p>
   <div class="eq">R = ρ l / A &nbsp;&nbsp;(ρ = resistivity, unit Ω m)</div>
   <p>Doubling the length doubles R. Doubling the area halves R. Alloys like <mark>nichrome</mark> have high resistivity and do not burn easily, so they are used in heaters and irons.</p>`},
  {h:'Resistors in series and parallel', b:`<div class="tbl"><table><tr><th></th><th>Series</th><th>Parallel</th></tr>
   <tr><td>Equivalent resistance</td><td>Rₛ = R₁ + R₂ + R₃</td><td>1/Rₚ = 1/R₁ + 1/R₂ + 1/R₃</td></tr>
   <tr><td>Same across all</td><td>Current</td><td>Potential difference</td></tr>
   <tr><td>Result</td><td>Rₛ is larger than any single resistor</td><td>Rₚ is smaller than the smallest resistor</td></tr></table></div>
   <p>Household appliances are connected in <b>parallel</b>, so each gets the full voltage and can be switched on and off on its own.</p>`},
  {h:'Heating effect of current', b:`<p><mark>Joule's law of heating</mark>: H = I²Rt. The heat produced is proportional to the square of the current, the resistance and the time.</p>
   <p>Uses: electric iron, toaster, heater, bulb and fuse. A bulb filament is made of tungsten (melting point 3380 °C) and the bulb is filled with nitrogen or argon. A <mark>fuse</mark> has a low melting point and melts when too much current flows, breaking the circuit.</p>`},
  {h:'Electric power', b:`<div class="eq">P = VI = I²R = V²/R</div>
   <p>The unit of power is the watt (W). The commercial unit of energy is the <mark>kilowatt hour</mark> (kWh), the “unit” on your electricity bill.</p>
   <div class="eq">1 kWh = 1000 W × 3600 s = 3.6 × 10⁶ J</div>`}

C['math-5'] = {
 notes:[
  {h:'What is an AP?', b:`<p>An <mark>arithmetic progression</mark> is a list of numbers where each term is obtained by adding a fixed number to the previous term. That fixed number is the <mark>common difference</mark>, d.</p>
   <div class="eq">a, a + d, a + 2d, a + 3d, …</div>
   <p>Examples: 2, 5, 8, 11 (d = 3) &nbsp;·&nbsp; 10, 6, 2, −2 (d = −4) &nbsp;·&nbsp; 3, 3, 3 (d = 0)</p>
   <div class="tip"><b>Check</b>To test if a list is an AP, find a₂ − a₁, a₃ − a₂, a₄ − a₃. They must all be equal.</div>`},
  {h:'The nth term', b:`<div class="eq">aₙ = a + (n − 1)d</div>
   <p><b>Example:</b> Is 301 a term of 5, 11, 17, 23, …?</p>
   <p>Here a = 5, d = 6. Put aₙ = 301: 5 + (n − 1)6 = 301, so (n − 1) = 296/6 = 49⅓. Since n is not a whole number, <b>301 is not a term</b>.</p>
   <p><b>Example:</b> How many two-digit numbers are divisible by 3? The list is 12, 15, …, 99. So 99 = 12 + (n − 1)3, giving n = <b>30</b>.</p>
   <p>The nth term from the end of an AP with last term l is l − (n − 1)d.</p>`},
  {h:'Sum of first n terms', b:`<div class="eq">Sₙ = n/2 [2a + (n − 1)d] &nbsp;&nbsp;or&nbsp;&nbsp; Sₙ = n/2 (a + l)</div>
   <p>The story: as a child, the mathematician Gauss added 1 to 100 by pairing terms: 1 + 100, 2 + 99, … gives 50 pairs of 101, so the sum is <b>5050</b>.</p>
   <p>Sum of the first n natural numbers: <b>n(n + 1)/2</b>. Sum of the first n odd numbers: <b>n²</b>.</p>
   <div class="tip"><b>Exam tip</b>If Sₙ is given, you can find any term using aₙ = Sₙ − Sₙ₋₁.</div>`}
 ],

C['math-8'] = {
 notes:[
  {h:'Trigonometric ratios', b:`<p>In a right triangle ABC with the right angle at B, for the angle A:</p>
   <div class="tbl"><table><tr><th>Ratio</th><th>Definition</th><th>Reciprocal</th></tr>
   <tr><td>sin A</td><td>opposite / hypotenuse = BC/AC</td><td>cosec A = 1/sin A</td></tr>
   <tr><td>cos A</td><td>adjacent / hypotenuse = AB/AC</td><td>sec A = 1/cos A</td></tr>
   <tr><td>tan A</td><td>opposite / adjacent = BC/AB</td><td>cot A = 1/tan A</td></tr></table></div>
   <p>Also, <b>tan A = sin A / cos A</b>. The ratios depend only on the angle, not on the size of the triangle.</p>
   <div class="tip"><b>Example</b>If sin A = 3/4, take BC = 3k, AC = 4k. Then AB = √(16k² − 9k²) = √7 k, so cos A = √7/4 and tan A = 3/√7.</div>`},
  {h:'Values for special angles', b:`<div class="tbl"><table><tr><th>∠A</th><th>0°</th><th>30°</th><th>45°</th><th>60°</th><th>90°</th></tr>
   <tr><td>sin A</td><td class="num">0</td><td class="num">1/2</td><td class="num">1/√2</td><td class="num">√3/2</td><td class="num">1</td></tr>
   <tr><td>cos A</td><td class="num">1</td><td class="num">√3/2</td><td class="num">1/√2</td><td class="num">1/2</td><td class="num">0</td></tr>
   <tr><td>tan A</td><td class="num">0</td><td class="num">1/√3</td><td class="num">1</td><td class="num">√3</td><td class="num">not defined</td></tr></table></div>
   <div class="tip"><b>Memory trick</b>For sin, write √0/2, √1/2, √2/2, √3/2, √4/2 for 0°, 30°, 45°, 60°, 90°. cos is the same list backwards.</div>`},
  {h:'Trigonometric identities', b:`<div class="eq">sin²A + cos²A = 1<br>1 + tan²A = sec²A &nbsp;&nbsp;(0° ≤ A &lt; 90°)<br>1 + cot²A = cosec²A &nbsp;&nbsp;(0° &lt; A ≤ 90°)</div>
   <p>All three come from Pythagoras: AB² + BC² = AC², divided by AC², AB² or BC².</p>
   <div class="tip"><b>Exam tip</b>To prove an identity, start from the more complicated side and convert everything to sin and cos.</div>`}
 ],

C['hist-2'] = {
 notes:[
  {h:'The First World War and India', b:`<p>The war created a new economic and political situation:</p>
   <ul><li>Defence spending went up, financed by war loans and higher taxes. Customs duties were raised and <mark>income tax</mark> was introduced.</li>
   <li>Prices doubled between 1913 and 1918.</li><li>Forced recruitment in villages caused widespread anger.</li>
   <li>Crops failed in 1918–19 and 1920–21, and an influenza epidemic followed. 12 to 13 million people died.</li></ul>`},
  {h:'The idea of Satyagraha', b:`<p>Mahatma Gandhi returned to India in January 1915 from South Africa. <mark>Satyagraha</mark> is the power of truth: a non-violent struggle that appeals to the conscience of the oppressor.</p>
   <ul><li><b>1917, Champaran (Bihar):</b> peasants against the oppressive plantation system.</li>
   <li><b>1917, Kheda (Gujarat):</b> peasants affected by crop failure and plague could not pay revenue.</li>
   <li><b>1918, Ahmedabad:</b> cotton mill workers.</li></ul>`},
  {h:'Rowlatt Act and Jallianwala Bagh', b:`<p>The <mark>Rowlatt Act (1919)</mark> allowed the government to detain political prisoners without trial for two years. Gandhi called a hartal on 6 April 1919.</p>
   <p>On <mark>13 April 1919</mark>, a crowd gathered in Jallianwala Bagh, Amritsar, some for the Baisakhi fair. General Dyer blocked the exits and opened fire, killing hundreds. The massacre triggered strikes and clashes across north India.</p>`},
  {h:'Khilafat and Non-Cooperation', b:`<p>Gandhi wanted Hindus and Muslims to come together. After the Ottoman emperor (the Khalifa) faced a harsh peace treaty, a Khilafat Committee was formed in Bombay in March 1919 by Muhammad Ali and Shaukat Ali.</p>
   <p>At the Calcutta session (September 1920) Congress leaders agreed to start the movement, and the Nagpur session (December 1920) adopted the programme. The <mark>Non-Cooperation Movement</mark> began in January 1921.</p>
   <ul><li><b>Towns:</b> students left government schools, lawyers gave up practice, foreign cloth was burnt. Import of foreign cloth halved between 1921 and 1922.</li>
   <li><b>Awadh:</b> Baba Ramchandra led peasants against talukdars and landlords. The Oudh Kisan Sabha was set up in October 1920.</li>
   <li><b>Gudem Hills (Andhra Pradesh):</b> Alluri Sitaram Raju led a guerrilla tribal movement.</li>
   <li><b>Assam plantations:</b> workers left the plantations, though the Inland Emigration Act of 1859 did not allow them to leave without permission.</li></ul>
   <p>Gandhi withdrew the movement in February 1922 after the violence at <mark>Chauri Chaura</mark>.</p>`},
  {h:'Towards Civil Disobedience', b:`<p>The Simon Commission arrived in 1928 with no Indian member and was greeted with “Go back Simon”. The Lahore Congress (December 1929), under Jawaharlal Nehru, adopted the demand for <mark>Purna Swaraj</mark>. 26 January 1930 was celebrated as Independence Day.</p>
   <p>On 31 January 1930 Gandhi sent Viceroy Irwin eleven demands, including the abolition of the salt tax. On 12 March 1930 he began the <mark>Salt March</mark> from Sabarmati Ashram with 78 volunteers, walking about 240 miles to Dandi in 24 days, and broke the salt law on 6 April 1930.</p>
   <p>The Gandhi–Irwin Pact was signed on 5 March 1931, and Gandhi went to the Second Round Table Conference in London in December 1931. The movement was relaunched afterwards but lost momentum by 1934.</p>`},
  {h:'Who joined, and the limits', b:`<ul><li><b>Rich peasants</b> (Patidars of Gujarat, Jats of UP) were hit by falling prices and high revenue.</li>
   <li><b>Business classes</b> formed FICCI in 1927 (Purshottamdas Thakurdas, G. D. Birla) and wanted protection against foreign goods.</li>
   <li><b>Women</b> joined protest marches, made salt and picketed shops.</li>
   <li><b>Dalits:</b> Dr B. R. Ambedkar organised the Depressed Classes Association in 1930 and demanded separate electorates. The <mark>Poona Pact</mark> of September 1932 gave reserved seats instead.</li>
   <li>Many Muslim groups felt distant from Congress after the Non-Cooperation–Khilafat phase.</li></ul>`},
  {h:'A sense of collective belonging', b:`<p>Nationalism also spread through images, songs and symbols. Bankim Chandra Chattopadhyay wrote “Vande Mataram” in the 1870s, and Abanindranath Tagore painted <mark>Bharat Mata</mark>. Folk tales were collected, and flags were designed: a tricolour (red, green, yellow) with eight lotuses during the Swadeshi movement in Bengal, and Gandhi's Swaraj flag (red, green, white) with a spinning wheel in 1921.</p>`}
 ],

C['geo-1'] = {
 notes:[
  {h:'What is a resource?', b:`<p>Everything in our environment that can be used to satisfy our needs is a <mark>resource</mark>, provided it is technologically accessible, economically feasible and culturally acceptable. Resources are a result of interaction between nature, technology and institutions.</p>`},
  {h:'Classification of resources', b:`<div class="tbl"><table><tr><th>Basis</th><th>Types</th></tr>
   <tr><td>Origin</td><td><b>Biotic</b> (from living things: plants, animals, fish) and <b>abiotic</b> (non-living: rocks, metals)</td></tr>
   <tr><td>Exhaustibility</td><td><b>Renewable</b> (solar, wind, water, forests) and <b>non-renewable</b> (coal, petroleum, minerals)</td></tr>
   <tr><td>Ownership</td><td>Individual, community, national, international</td></tr>
   <tr><td>Status of development</td><td><b>Potential</b> (not yet used, e.g. wind in Rajasthan), <b>developed</b>, <b>stock</b> (no technology yet, e.g. hydrogen from water), <b>reserves</b> (subset of stock that can be used with existing technology)</td></tr></table></div>`},
  {h:'Sustainable development', b:`<p>Overuse of resources leads to depletion, accumulation of resources in a few hands and ecological crises. <mark>Sustainable development</mark> means development without damaging the environment and without compromising the needs of future generations.</p>
   <p>The <mark>Earth Summit</mark> at Rio de Janeiro (June 1992) adopted <b>Agenda 21</b>, a plan to combat environmental damage, poverty and disease through global cooperation.</p>`},
  {h:'Resource planning and land', b:`<p>Resource planning in India involves: identifying and listing resources (surveying, mapping, estimating), making a planning structure with the right technology and skills, and matching it with national development plans.</p>
   <p>Land degradation is caused by mining (Jharkhand, Chhattisgarh, Madhya Pradesh, Odisha), overgrazing (Gujarat, Rajasthan, Madhya Pradesh, Maharashtra) and over-irrigation that causes waterlogging and salinity (Punjab, Haryana, western Uttar Pradesh). The National Forest Policy (1952) set a target of 33% of area under forests.</p>`},
  {h:'Soils of India', b:`<div class="tbl"><table><tr><th>Soil</th><th>Key facts</th></tr>
   <tr><td>Alluvial</td><td>Most widespread, deposited by the Indus, Ganga and Brahmaputra. Old alluvium = <b>bangar</b>, new = <b>khadar</b>. Very fertile.</td></tr>
   <tr><td>Black (regur)</td><td>Formed from lava (Deccan trap). Holds moisture, develops deep cracks in summer. Ideal for <b>cotton</b>. Maharashtra, Gujarat, MP.</td></tr>
   <tr><td>Red and yellow</td><td>From crystalline igneous rocks. Red due to iron; yellow when hydrated.</td></tr>
   <tr><td>Laterite</td><td>High temperature and heavy rain cause intense leaching. Good for cashew, tea, coffee with manure.</td></tr>
   <tr><td>Arid</td><td>Sandy, saline, red to brown. Kankar layer below. Rajasthan.</td></tr>
   <tr><td>Forest</td><td>Found in hilly and mountainous areas.</td></tr></table></div>`},
  {h:'Soil erosion and conservation', b:`<p>Running water cuts deep channels called <mark>gullies</mark>; land that becomes unfit for farming is called bad land (ravines in the Chambal basin). Water flowing as a sheet over large areas causes <mark>sheet erosion</mark>, and wind blows loose soil away.</p>
   <p>Conservation methods: <b>contour ploughing</b>, <b>terrace farming</b> on slopes, <b>strip cropping</b> (grass strips between crops), and <b>shelter belts</b> of trees to break wind.</p>`}
 ],

C['civ-1'] = {
 notes:[
  {h:'Belgium: accommodation', b:`<p>Belgium is a small European country with a complex ethnic mix:</p>
   <div class="tbl"><table><tr><th>Group</th><th>Share</th><th>Where</th></tr>
   <tr><td>Dutch speakers</td><td class="num">59%</td><td>Flemish region</td></tr>
   <tr><td>French speakers</td><td class="num">40%</td><td>Wallonia</td></tr>
   <tr><td>German speakers</td><td class="num">1%</td><td></td></tr></table></div>
   <p>In the capital Brussels, 80% speak French and 20% Dutch. The French-speaking minority was richer and more powerful, which caused tension.</p>
   <p>Between 1970 and 1993 Belgium amended its constitution four times. The <mark>Belgian model</mark>:</p>
   <ul><li>Equal number of Dutch and French ministers in the central government.</li>
   <li>Many powers given to state governments, which are not subordinate to the centre.</li>
   <li>Brussels has a separate government with equal representation for both communities.</li>
   <li>A <mark>community government</mark>, elected by people of one language community, handles cultural, educational and language issues.</li></ul>`},
  {h:'Sri Lanka: majoritarianism', b:`<p>Sinhala speakers are about 74% of the population and Tamil speakers about 18% (Sri Lankan Tamils 13%, Indian Tamils 5%). Sri Lanka became independent in 1948.</p>
   <ul><li>An Act of <mark>1956</mark> made Sinhala the only official language.</li>
   <li>Governments favoured Sinhala applicants for university places and jobs.</li>
   <li>The constitution said the state would protect and foster Buddhism.</li></ul>
   <p>Sri Lankan Tamils felt alienated. Their demand for an independent Tamil Eelam led to a civil war that ended in 2009. This is <mark>majoritarianism</mark>: the majority community rules in whatever way it wants.</p>`},
  {h:'Why power sharing is desirable', b:`<ul><li><b>Prudential reason:</b> it reduces the possibility of conflict between social groups and gives political stability.</li>
   <li><b>Moral reason:</b> it is the very spirit of democracy. People have a right to be consulted on how they are governed.</li></ul>`},
  {h:'Forms of power sharing', b:`<div class="tbl"><table><tr><th>Form</th><th>Shared among</th><th>Example</th></tr>
   <tr><td>Horizontal</td><td>Organs of government: legislature, executive, judiciary</td><td>Checks and balances; judges can check the executive</td></tr>
   <tr><td>Vertical</td><td>Levels of government</td><td>Union, state and local governments (federalism)</td></tr>
   <tr><td>Among social groups</td><td>Religious and linguistic groups</td><td>Community government in Belgium; reserved constituencies in India</td></tr>
   <tr><td>Parties, pressure groups, movements</td><td>Competing parties and interest groups</td><td>Coalition governments; trade unions influencing policy</td></tr></table></div>`}

C['eco-1'] = {
 notes:[
  {h:'What development promises', b:`<p>Different people have <mark>different development goals</mark>. A landless rural labourer wants more days of work and better wages; a rich farmer wants higher prices for crops; an urban girl wants as much freedom as her brother. Goals can also conflict: a dam may give electricity to industry but submerge the land of the people who live there.</p>
   <p>People want not only more income but also equal treatment, freedom, security and respect.</p>`},
  {h:'Comparing countries: income', b:`<p>Countries are usually compared by income. Since populations differ, we use <mark>average income</mark>, also called <mark>per capita income</mark>:</p>
   <div class="eq">Per capita income = Total income of the country ÷ Total population</div>
   <p>The World Bank uses per capita income to classify countries as rich (high income), middle income or low income. India is a lower-middle-income country.</p>
   <div class="tip"><b>Limitation</b>An average hides how income is shared. Two countries can have the same average while one is far more unequal. Try it in the “Try it” tab.</div>`},
  {h:'Income and other criteria', b:`<p>Money cannot buy everything: a pollution-free environment, unadulterated medicines or protection from disease often need public facilities. Other indicators:</p>
   <ul><li><mark>Infant mortality rate (IMR)</mark>: number of children who die before the age of one, per 1000 live births.</li>
   <li><mark>Literacy rate</mark>: proportion of literate population in the 7-and-above age group.</li>
   <li><mark>Net attendance ratio</mark>: children aged 14–15 attending school as a percentage of all children of that age group.</li></ul>
   <p>Kerala has a low infant mortality rate because it has adequate basic health and educational facilities, and its public distribution system works well.</p>`},
  {h:'Human Development Index', b:`<p>The <mark>UNDP</mark> publishes the Human Development Report, which ranks countries by the Human Development Index (HDI). HDI combines:</p>
   <ul><li>Health: life expectancy at birth</li><li>Education: mean years and expected years of schooling</li><li>Standard of living: per capita income</li></ul>
   <p>Sri Lanka, a much smaller country, ranks higher than India on HDI.</p>`},
  {h:'Sustainability of development', b:`<p>Development should not harm the environment or future generations. Groundwater is being overused in many parts of India, and crude oil reserves are limited. Resources once used up cannot be replaced, so <mark>sustainable development</mark> is a concern for everyone.</p>`}

C['ff-1'] = {
 notes:[
  {h:'About the story', b:`<p><b>A Letter to God</b> is a story by G. L. Fuentes, set in rural Mexico. It is about a farmer's complete faith in God, the kindness of strangers, and an ending full of irony.</p>`},
  {h:'Summary', b:`<p><mark>Lencho</mark> is a farmer whose house stands on the crest of a low hill. His field of ripe corn, dotted with flowers, needs one good shower. When the rain comes, he says the big drops are like ten-cent coins and the small ones like fives.</p>
   <p>But a strong wind brings huge hailstones. In an hour the field is white, <mark>as if covered with salt</mark>. The crop is destroyed. Lencho says a plague of locusts would have left more than this. The family has nothing left, except one hope: help from God.</p>
   <p>Lencho writes a letter asking God for <mark>100 pesos</mark> to sow his field again and to live until the next crop. He addresses it “To God” and posts it.</p>
   <p>The postmaster laughs at first, then is moved by Lencho's faith. He decides to answer the letter so that this faith is not shaken. He gives part of his own salary and collects money from his employees and friends, but can gather only a little more than half: <mark>70 pesos</mark>. He signs the letter “God”.</p>
   <p>Lencho is not surprised to find money, but he is angry when he counts it. He writes again asking God for the remaining 30 pesos, and adds: do not send it by mail, because <mark>“the post office employees are a bunch of crooks.”</mark></p>`},
  {h:'Characters', b:`<ul><li><b>Lencho:</b> hardworking, honest, simple and has unshakable faith in God. He is also ungrateful without knowing it.</li>
   <li><b>The postmaster:</b> fat, amiable and generous. He helps a stranger secretly, without expecting thanks.</li></ul>`},
  {h:'Themes and irony', b:`<ul><li><b>Faith:</b> Lencho never doubts that God will help.</li><li><b>Humanity:</b> the postmaster and his staff help a stranger.</li><li><b>Irony:</b> the people who helped Lencho are the ones he calls crooks. The man who believes in God cannot see the goodness of the people around him.</li></ul>
   <div class="tip"><b>Answer-writing tip</b>When asked about the ending, use the word <i>irony</i> and explain both sides: the postmaster's kindness and Lencho's distrust.</div>`}
 ],

 notes:[
  {h:'पाठ के बारे में', b:`<p><b>नेताजी का चश्मा</b> स्वयं प्रकाश की कहानी है। यह बताती है कि देशभक्ति केवल बड़े लोगों में नहीं, बल्कि आम लोगों के छोटे-छोटे कामों में भी दिखती है।</p>`},
  {h:'कहानी का सार', b:`<p>कंपनी के काम से <mark>हालदार साहब</mark> हर पंद्रहवें दिन एक छोटे कस्बे से गुज़रते थे। कस्बे के मुख्य चौराहे पर <mark>नेताजी सुभाषचंद्र बोस</mark> की संगमरमर की मूर्ति लगी थी। मूर्ति कस्बे के हाई स्कूल के ड्राइंग मास्टर <mark>मोतीलाल</mark> ने बनाई थी। मूर्ति सुंदर थी, पर उसकी आँखों पर संगमरमर का चश्मा नहीं था; उसकी जगह एक असली चश्मा पहनाया गया था।</p>
   <p>हर बार हालदार साहब देखते कि चश्मा बदल जाता है। पानवाले से पूछने पर पता चला कि यह काम <mark>कैप्टन चश्मेवाला</mark> करता है—एक बूढ़ा, कमज़ोर, लँगड़ा आदमी जो फेरी लगाकर चश्मे बेचता है। जब कोई ग्राहक मूर्ति पर लगा फ्रेम माँगता, तो वह उसे उतारकर बेच देता और मूर्ति पर दूसरा फ्रेम लगा देता। उसे बिना चश्मे के नेताजी अच्छे नहीं लगते थे।</p>
   <p>लोग उसे मज़ाक में <i>कैप्टन</i> कहते थे और पानवाला उसे ‘पागल’ कहता था। हालदार साहब को यह बुरा लगा।</p>
   <p>दो साल बाद हालदार साहब ने देखा कि मूर्ति पर कोई चश्मा नहीं है। पता चला कि <mark>कैप्टन मर गया</mark>। वे बहुत दुखी हुए। अगली बार उन्होंने ड्राइवर से कहा कि चौराहे पर गाड़ी न रोके। पर आदत से उनकी नज़र मूर्ति पर पड़ गई—मूर्ति की आँखों पर <mark>सरकंडे से बना छोटा-सा चश्मा</mark> रखा था, जो किसी बच्चे ने बनाया था। हालदार साहब भावुक हो गए और उनकी आँखें भर आईं।</p>`},
  {h:'पात्र-परिचय', b:`<ul><li><b>हालदार साहब:</b> संवेदनशील और देशभक्त; छोटी बातों को गहराई से महसूस करते हैं।</li>
   <li><b>कैप्टन चश्मेवाला:</b> गरीब, पर सच्चा देशभक्त; नेताजी के प्रति गहरा सम्मान।</li>
   <li><b>पानवाला:</b> मज़ाकिया, बातूनी; कैप्टन का मज़ाक उड़ाता है, पर उसकी मौत पर उसकी आँखें भी भर आती हैं।</li></ul>`},
  {h:'मूल भाव', b:`<p>देश के निर्माण में हर नागरिक का योगदान होता है। कैप्टन जैसा साधारण आदमी और सरकंडे का चश्मा बनाने वाला बच्चा दिखाते हैं कि <mark>देशभक्ति</mark> की भावना आने वाली पीढ़ी में भी जीवित है।</p>
   <div class="tip"><b>परीक्षा सुझाव</b>“सरकंडे का चश्मा” किस बात का प्रतीक है—यह प्रश्न बार-बार पूछा जाता है। उत्तर: बच्चों में देशभक्ति की भावना और आशा।</div>`}

 notes:[
  {h:'Parts of the human eye', b:`<p>The eye works like a camera. Light enters through the <mark>cornea</mark>, passes through the <mark>pupil</mark> and the <mark>eye lens</mark>, and forms a <b>real, inverted</b> image on the <mark>retina</mark>. The <mark>optic nerve</mark> carries signals to the brain, which makes us see the object upright. The eyeball is about 2.3 cm across.</p>
   <ul><li><b>Iris</b> controls the size of the pupil, and so the amount of light entering.</li><li><b>Ciliary muscles</b> change the curvature of the lens.</li></ul>
   <div class="tip"><b>Try it</b>Open the Pictures tab and tap each part of the eye, then switch to “Test me”.</div>`},
  {h:'Power of accommodation', b:`<p>The ability of the eye lens to change its focal length is called the <mark>power of accommodation</mark>.</p>
   <ul><li>Looking far: ciliary muscles relax, the lens becomes thin, focal length increases.</li><li>Looking near: ciliary muscles contract, the lens becomes thick, focal length decreases.</li></ul>
   <p><b>Near point</b> (least distance of distinct vision) for a normal young adult is about <mark>25 cm</mark>. <b>Far point</b> is infinity.</p>
   <p>In old age the lens can become milky and cloudy. This is <mark>cataract</mark>, and it is treated by surgery.</p>`},
  {h:'Defects of vision', b:`<div class="tbl"><table><tr><th>Defect</th><th>Problem</th><th>Cause</th><th>Correction</th></tr>
   <tr><td>Myopia (near-sightedness)</td><td>Cannot see distant objects; image forms <b>in front of</b> the retina</td><td>Lens too curved, or eyeball too long</td><td>Concave lens</td></tr>
   <tr><td>Hypermetropia (far-sightedness)</td><td>Cannot see nearby objects; near point beyond 25 cm; image forms <b>behind</b> the retina</td><td>Focal length too long, or eyeball too small</td><td>Convex lens</td></tr>
   <tr><td>Presbyopia</td><td>Near point recedes with age</td><td>Ciliary muscles weaken, lens loses flexibility</td><td>Bifocal lens</td></tr></table></div>`},
  {h:'Prism and dispersion', b:`<p>A glass prism bends light twice. The angle between the incident ray and the emergent ray is the <b>angle of deviation</b>.</p>
   <p>White light splits into seven colours, <mark>VIBGYOR</mark>. This is <mark>dispersion</mark>. Red bends the least and violet the most. Isaac Newton showed that a second, inverted prism recombines the colours into white light.</p>
   <p>A <b>rainbow</b> is a natural spectrum seen after rain, opposite the Sun. Water droplets act like tiny prisms: they refract, disperse and internally reflect sunlight.</p>`},
  {h:'Atmospheric refraction', b:`<ul><li><b>Twinkling of stars:</b> starlight is refracted by layers of air whose density keeps changing, so the star's apparent position and brightness flicker. Planets are closer and look like extended sources, so they do not twinkle.</li>
   <li><b>Advance sunrise and delayed sunset:</b> refraction lets us see the Sun about 2 minutes before it actually rises and about 2 minutes after it sets.</li></ul>`},
  {h:'Scattering of light', b:`<p>The <mark>Tyndall effect</mark> is the scattering of light by fine particles, which makes the path of a beam visible, as when sunlight enters a dense forest or a smoky room.</p>
   <ul><li><b>Blue sky:</b> tiny air molecules scatter short wavelengths (blue) much more than red. Without an atmosphere, as for an astronaut in space, the sky looks dark.</li>
   <li><b>Red sunrise and sunset:</b> light travels a longer path through air, most blue is scattered away, and mainly red reaches us.</li>
   <li><b>Danger signals are red:</b> red light is scattered the least, so it can be seen from far away.</li></ul>`}
 ],

C['sci-2'] = {
 notes:[
  {h:'Spotting acids and bases', b:`<p><mark>Acids</mark> taste sour and turn blue litmus red. <mark>Bases</mark> taste bitter, feel soapy and turn red litmus blue. Never taste chemicals in the lab: use <mark>indicators</mark> instead.</p>
   <ul><li><b>Natural:</b> litmus (a purple dye from lichen), turmeric (turns reddish-brown with bases), red cabbage.</li>
   <li><b>Synthetic:</b> phenolphthalein (pink in bases, colourless in acids) and methyl orange (red in acids, yellow in bases).</li>
   <li><b>Olfactory:</b> substances whose smell changes in acid or base. Onion, vanilla and clove are examples.</li></ul>`},
  {h:'How acids and bases react', b:`<div class="tbl"><table><tr><th>Reaction</th><th>General result</th></tr>
   <tr><td>Acid + metal</td><td>Salt + hydrogen gas (burns with a pop sound)</td></tr>
   <tr><td>Base (NaOH) + zinc</td><td>Sodium zincate + hydrogen</td></tr>
   <tr><td>Acid + metal carbonate or hydrogencarbonate</td><td>Salt + carbon dioxide + water (CO₂ turns lime water milky)</td></tr>
   <tr><td>Acid + base</td><td>Salt + water. This is <mark>neutralisation</mark>.</td></tr>
   <tr><td>Acid + metal oxide</td><td>Salt + water, so metal oxides are basic</td></tr>
   <tr><td>Base + non-metal oxide (CO₂)</td><td>Salt + water, so non-metal oxides are acidic</td></tr></table></div>
   <div class="eq">NaOH(aq) + HCl(aq) → NaCl(aq) + H₂O(l)</div>`},
  {h:'Ions in water', b:`<p>Acids produce <mark>H⁺ ions</mark> in water, which exist as <b>hydronium ions (H₃O⁺)</b>. Bases soluble in water are called <mark>alkalis</mark>, and they produce <b>OH⁻ ions</b>. That is why acid and base solutions conduct electricity.</p>
   <p>Dry HCl gas does not change the colour of dry litmus paper, because without water there are no H⁺ ions.</p>
   <div class="tip"><b>Safety</b>Mixing a concentrated acid with water releases a lot of heat. Always add the acid slowly to water, while stirring, never water to acid.</div>`},
  {h:'The pH scale', b:`<p>The <mark>pH scale</mark> runs from 0 (very acidic) through 7 (neutral) to 14 (very basic). The lower the pH, the more H⁺ ions. <b>Universal indicator</b> shows different colours across the whole scale.</p>
   <ul><li>Our body works within a narrow pH range of about 7.0 to 7.8.</li>
   <li>Rain with a pH below <b>5.6</b> is <mark>acid rain</mark>, which harms river life.</li>
   <li>Tooth decay starts when the pH in the mouth falls below <b>5.5</b>. Basic toothpaste neutralises the extra acid.</li>
   <li>Too much acid in the stomach causes indigestion. <b>Antacids</b> such as milk of magnesia (magnesium hydroxide) neutralise it.</li>
   <li>A bee sting or nettle sting injects <b>methanoic acid</b>. Rubbing a mild base such as baking soda gives relief.</li></ul>`},
  {h:'Salts and chemicals from common salt', b:`<p>Salts formed from a strong acid and a strong base are neutral (pH 7). Strong acid + weak base gives an acidic salt; weak acid + strong base gives a basic salt.</p>
   <div class="tbl"><table><tr><th>Chemical</th><th>Formula</th><th>Made or used</th></tr>
   <tr><td>Sodium hydroxide</td><td>NaOH</td><td><mark>Chlor-alkali process</mark>: electrolysis of brine gives NaOH, chlorine and hydrogen</td></tr>
   <tr><td>Bleaching powder</td><td>CaOCl₂</td><td>Chlorine + dry slaked lime. Bleaching cloth, disinfecting water</td></tr>
   <tr><td>Baking soda</td><td>NaHCO₃</td><td>Releases CO₂ on heating, so cakes rise. Antacids, fire extinguishers</td></tr>
   <tr><td>Washing soda</td><td>Na₂CO₃·10H₂O</td><td>Removes permanent hardness of water, used in glass, soap and paper industries</td></tr>
   <tr><td>Plaster of Paris</td><td>CaSO₄·½H₂O</td><td>Made by heating gypsum (CaSO₄·2H₂O). Sets hard with water; used for plasters on fractured bones</td></tr></table></div>
   <p>The fixed number of water molecules in a salt's crystal is its <mark>water of crystallisation</mark>. Blue copper sulphate (CuSO₄·5H₂O) turns white when heated as it loses this water.</p>`}
 ],

  ['Which indicator turns pink in a basic solution?',['Methyl orange','Phenolphthalein','Blue litmus','Turmeric'],1,'Phenolphthalein is colourless in acids and pink in bases.'],
  ['Acid + metal carbonate gives salt, water and…',['Hydrogen','Oxygen','Carbon dioxide','Chlorine'],2,'The gas turns lime water milky.'],
  ['Tooth decay starts when the pH in the mouth falls below',['7','6.5','5.5','4'],2,'Bacteria produce acids that attack enamel below pH 5.5.'],

  ['The chemical formula of Plaster of Paris is',['CaSO₄·2H₂O','CaSO₄·½H₂O','CaCO₃','CaOCl₂'],1,'Calcium sulphate hemihydrate. Gypsum is the dihydrate.'],

C['sci-3'] = {
 notes:[
  {h:'Physical properties', b:`<div class="tbl"><table><tr><th>Metals</th><th>Non-metals</th></tr>
   <tr><td>Shiny (<mark>metallic lustre</mark>)</td><td>Usually dull</td></tr>
   <tr><td><mark>Malleable</mark> (beaten into sheets) and <mark>ductile</mark> (drawn into wires)</td><td>Brittle if solid</td></tr>
   <tr><td>Good conductors of heat and electricity; silver and copper are the best</td><td>Poor conductors</td></tr>
   <tr><td>Sonorous (make a ringing sound)</td><td>Not sonorous</td></tr></table></div>
   <p><b>Exceptions to remember:</b> mercury is a liquid metal. Gallium and caesium melt in your palm. Sodium and potassium are so soft they can be cut with a knife. Iodine is a non-metal but shiny. Diamond, a form of carbon, is the hardest natural substance, and graphite conducts electricity.</p>`},
  {h:'Chemical properties of metals', b:`<ul><li><b>With oxygen:</b> metal + oxygen → metal oxide. Most metal oxides are basic, but aluminium oxide and zinc oxide react with both acids and bases, so they are <mark>amphoteric oxides</mark>.</li>
   <li><b>With water:</b> sodium and potassium react violently with cold water, so they are stored in kerosene. Magnesium reacts with hot water; iron, zinc and aluminium react only with steam. Lead, copper, silver and gold do not react with water.</li>
   <li><b>With acids:</b> metal + dilute acid → salt + hydrogen. Nitric acid is a strong oxidising agent and usually does not release hydrogen, except with magnesium and manganese in very dilute acid.</li>
   <li><b>Displacement:</b> a more reactive metal displaces a less reactive one from its salt solution.</li></ul>
   <p><mark>Aqua regia</mark> is a fresh 3:1 mix of concentrated hydrochloric and nitric acids. It can dissolve gold and platinum.</p>`},
  {h:'The reactivity series', b:`<div class="eq">K &gt; Na &gt; Ca &gt; Mg &gt; Al &gt; Zn &gt; Fe &gt; Pb &gt; [H] &gt; Cu &gt; Hg &gt; Ag &gt; Au</div>
   <p>Metals above hydrogen can displace hydrogen from dilute acids. Put the series in order yourself in the Lab.</p>`},
  {h:'How metals and non-metals bond', b:`<p>Metals lose electrons and non-metals gain them, so they form <mark>ionic compounds</mark>. In sodium chloride, sodium gives one electron to chlorine, forming Na⁺ and Cl⁻.</p>
   <p>Ionic compounds are hard solids with high melting and boiling points. They dissolve in water but not in kerosene or petrol, and conduct electricity when molten or dissolved, because the ions can then move.</p>`},
  {h:'Getting metals out of ores', b:`<p>Minerals from which metals can be extracted profitably are <mark>ores</mark>. The unwanted sand and soil mixed with them is <b>gangue</b>, which is removed first.</p>
   <div class="tbl"><table><tr><th>Position in series</th><th>Method</th></tr>
   <tr><td>Low (Hg, Cu)</td><td>Heating the ore alone is enough</td></tr>
   <tr><td>Middle (Zn, Fe, Pb)</td><td>Convert to oxide: <mark>roasting</mark> (sulphide ores, heat in air) or <mark>calcination</mark> (carbonate ores, heat with little air), then reduce with carbon</td></tr>
   <tr><td>Top (Na, Mg, Ca, Al)</td><td>Electrolysis of the molten chloride or oxide</td></tr></table></div>
   <p>In the <mark>thermit reaction</mark>, aluminium reduces iron(III) oxide so violently that the iron comes out molten. It is used to join railway tracks. Metals are purified by <b>electrolytic refining</b>: impure metal is the anode and pure metal collects on the cathode.</p>`},
  {h:'Corrosion and alloys', b:`<p>Iron rusts when exposed to moist air. It can be protected by painting, oiling, greasing, <mark>galvanising</mark> (coating with zinc), chrome plating or making alloys.</p>
   <ul><li><b>Stainless steel:</b> iron mixed with nickel and chromium. Hard and does not rust.</li>
   <li><b>Brass:</b> copper and zinc. <b>Bronze:</b> copper and tin.</li>
   <li><b>Solder:</b> lead and tin, low melting point, used to weld electrical wires.</li>
   <li><b>Amalgam:</b> any alloy that contains mercury.</li>
   <li><b>22 carat gold:</b> 22 parts gold to 2 parts copper or silver, harder than pure 24 carat gold.</li></ul>`}
 ],

  ['Sodium is stored in',['Water','Alcohol','Kerosene','Open air'],2,'It reacts violently with air and water.'],

C['sci-4'] = {
 notes:[
  {h:'Carbon shares electrons', b:`<p>Carbon has 4 electrons in its outer shell. Losing or gaining 4 would take too much energy, so carbon <mark>shares</mark> electrons. A bond formed by sharing a pair of electrons is a <mark>covalent bond</mark>.</p>
   <p>Covalent compounds have low melting and boiling points and are poor conductors of electricity, because they have no ions. Examples: H₂ (single bond), O₂ (double bond), N₂ (triple bond), CH₄ (methane).</p>
   <p>Carbon exists in different forms, called <mark>allotropes</mark>: diamond (each carbon bonded to 4 others, very hard), graphite (layers of hexagons, smooth, conducts electricity) and fullerenes such as C-60.</p>`},
  {h:'Why there are so many carbon compounds', b:`<ul><li><mark>Catenation</mark>: carbon atoms link to each other to form long chains, branches and rings.</li>
   <li><mark>Tetravalency</mark>: with a valency of 4, carbon can bond with oxygen, hydrogen, nitrogen, sulphur, chlorine and many more.</li></ul>
   <p>Compounds of only carbon and hydrogen are <b>hydrocarbons</b>. <mark>Saturated</mark> ones have only single bonds (alkanes, like ethane). <mark>Unsaturated</mark> ones have double bonds (alkenes, like ethene) or triple bonds (alkynes, like ethyne).</p>
   <p>Cyclohexane (C₆H₁₂) is a ring; benzene (C₆H₆) is a ring with alternating double bonds.</p>`},
  {h:'Functional groups and naming', b:`<p>An atom or group that gives a compound its properties is a <mark>functional group</mark>. A <mark>homologous series</mark> is a family with the same functional group, where each member differs from the next by –CH₂– (14 u).</p>
   <div class="tbl"><table><tr><th>Group</th><th>Formula</th><th>Name ending</th><th>Example</th></tr>
   <tr><td>Alcohol</td><td>–OH</td><td>-ol</td><td>Propanol</td></tr>
   <tr><td>Aldehyde</td><td>–CHO</td><td>-al</td><td>Propanal</td></tr>
   <tr><td>Ketone</td><td>&gt;C=O</td><td>-one</td><td>Propanone</td></tr>
   <tr><td>Carboxylic acid</td><td>–COOH</td><td>-oic acid</td><td>Propanoic acid</td></tr>
   <tr><td>Halogen</td><td>–Cl, –Br</td><td>chloro-, bromo-</td><td>Chloropropane</td></tr></table></div>`},
  {h:'Chemical reactions of carbon compounds', b:`<ul><li><b>Combustion:</b> carbon compounds burn in oxygen to give CO₂, water, heat and light. Saturated hydrocarbons give a clean blue flame; unsaturated ones give a sooty yellow flame.</li>
   <li><b>Oxidation:</b> alkaline potassium permanganate or acidified potassium dichromate oxidises alcohols to acids. These are <mark>oxidising agents</mark>.</li>
   <li><b>Addition:</b> unsaturated compounds add hydrogen in the presence of a nickel catalyst. This <mark>hydrogenation</mark> turns vegetable oils into vegetable ghee.</li>
   <li><b>Substitution:</b> in sunlight, chlorine replaces hydrogen atoms in methane, one by one.</li></ul>`},
  {h:'Ethanol and ethanoic acid', b:`<p><mark>Ethanol</mark> (C₂H₅OH) is the alcohol in drinks and medicines like cough syrups. With sodium it gives hydrogen; with hot concentrated sulphuric acid it loses water and becomes ethene.</p>
   <p><mark>Ethanoic acid</mark> (CH₃COOH), also called acetic acid. A 5–8% solution in water is <b>vinegar</b>. Pure ethanoic acid freezes in cold weather, so it is called <b>glacial acetic acid</b>.</p>
   <p>Acid + alcohol with a little sulphuric acid gives a sweet-smelling <mark>ester</mark> (esterification). Heating an ester with NaOH gives back the alcohol and a sodium salt of the acid. This is <b>saponification</b>, the reaction that makes soap.</p>`},
  {h:'Soaps and detergents', b:`<p>A soap molecule has an ionic end that dissolves in water and a long carbon tail that dissolves in oil. In water, the tails point into the oily dirt and the ionic ends face outward, forming clusters called <mark>micelles</mark>. Rinsing carries the dirt away.</p>
   <p>In hard water, soap reacts with calcium and magnesium salts to form an insoluble <b>scum</b>. <mark>Detergents</mark> do not form scum, so they work in hard water too.</p>`}
 ],

C['sci-5'] = {
 notes:[
  {h:'What are life processes?', b:`<p>Even a sleeping living thing is busy inside: repairing and maintaining its body. The processes that do this are <mark>life processes</mark>: nutrition, respiration, transportation and excretion.</p>`},
  {h:'Nutrition', b:`<p><mark>Autotrophs</mark> (green plants, some bacteria) make their own food. <mark>Heterotrophs</mark> (animals, fungi) depend on others.</p>
   <div class="eq">6CO₂ + 12H₂O → C₆H₁₂O₆ + 6O₂ + 6H₂O &nbsp;(chlorophyll, sunlight)</div>
   <p>In <mark>photosynthesis</mark>, chlorophyll absorbs light, water splits into hydrogen and oxygen, and carbon dioxide is reduced to carbohydrate. Gases pass through tiny pores called <mark>stomata</mark>, opened and closed by <b>guard cells</b>.</p>
   <p><b>Human digestion, step by step:</b></p>
   <ul><li><b>Mouth:</b> saliva contains salivary amylase, which breaks starch into sugar.</li>
   <li><b>Stomach:</b> gastric glands release hydrochloric acid (acidic medium), pepsin (digests protein) and mucus (protects the lining).</li>
   <li><b>Small intestine:</b> bile from the liver breaks fats into small globules; pancreatic juice has trypsin (proteins) and lipase (fats). Finger-like <mark>villi</mark> increase the surface for absorption.</li>
   <li><b>Large intestine:</b> absorbs extra water; the rest leaves through the anus.</li></ul>`},
  {h:'Respiration', b:`<p>Glucose is first broken into a 3-carbon molecule, <b>pyruvate</b>, in the cytoplasm. What happens next depends on oxygen:</p>
   <div class="tbl"><table><tr><th>Where</th><th>Products</th></tr>
   <tr><td>Yeast, no oxygen (fermentation)</td><td>Ethanol + CO₂ + a little energy</td></tr>
   <tr><td>Our muscles, short of oxygen</td><td>Lactic acid (causes cramps) + energy</td></tr>
   <tr><td>Mitochondria, with oxygen (<mark>aerobic</mark>)</td><td>CO₂ + water + much more energy</td></tr></table></div>
   <p>The energy is stored as <mark>ATP</mark>, the energy currency of the cell. In our lungs, air reaches millions of tiny sacs called <mark>alveoli</mark>, where oxygen enters the blood and CO₂ leaves. <b>Haemoglobin</b> in red blood cells carries oxygen.</p>`},
  {h:'Transportation in humans', b:`<p>The heart has four chambers. The right side handles <b>deoxygenated</b> blood, the left side <b>oxygenated</b> blood, and a wall keeps them apart. Blood passes through the heart twice in each full circuit: this is <mark>double circulation</mark>. See it in the Scanner tab.</p>
   <ul><li><b>Arteries</b> carry blood away from the heart; thick, elastic walls.</li><li><b>Veins</b> bring blood back; valves stop backflow.</li><li><b>Capillaries</b> are one cell thick, where exchange happens.</li>
   <li><b>Platelets</b> help blood clot at a wound. <b>Lymph</b> carries digested fat and drains extra fluid back into the blood.</li></ul>`},
  {h:'Transportation in plants', b:`<p><mark>Xylem</mark> carries water and minerals up from the roots. Evaporation of water from leaves, <mark>transpiration</mark>, creates a pull that draws water up and also helps control temperature.</p>
   <p><mark>Phloem</mark> carries food made in the leaves to other parts. This movement is <b>translocation</b>, and it uses energy from ATP.</p>`},
  {h:'Excretion', b:`<p>The kidneys filter blood in tiny units called <mark>nephrons</mark>. Each has a cup-shaped Bowman's capsule around a cluster of capillaries (glomerulus). Useful substances such as glucose and water are reabsorbed; the rest forms urine, which goes through the ureters to the urinary bladder. The kidneys filter about <b>180 L</b> of fluid daily, but most of it is reabsorbed.</p>
   <p>If the kidneys fail, an <mark>artificial kidney</mark> removes waste by <b>dialysis</b>. Plants get rid of wastes through transpiration, by storing them in old leaves and bark that fall off, or as resins and gums.</p>`}
 ],

C['sci-6'] = {
 notes:[
  {h:'The nervous system', b:`<p>Receptors in our sense organs detect changes. The message travels as an electrical impulse through nerve cells called <mark>neurons</mark>: it is picked up by the <b>dendrites</b>, passes through the <b>cell body</b> and along the <b>axon</b>. At the end, a chemical crosses a small gap, the <mark>synapse</mark>, to start an impulse in the next neuron.</p>`},
  {h:'Reflex actions', b:`<p>A <mark>reflex action</mark> is a sudden, automatic response, such as pulling your hand away from a flame. The path it follows is the <mark>reflex arc</mark>: receptor → sensory neuron → spinal cord → motor neuron → muscle. Reflex arcs are formed in the spinal cord, so the response is fast, though the information still reaches the brain.</p>`},
  {h:'The human brain', b:`<div class="tbl"><table><tr><th>Part</th><th>What it controls</th></tr>
   <tr><td>Fore-brain</td><td>Thinking. Has areas for hearing, smell, sight, and for controlling voluntary muscles</td></tr>
   <tr><td>Mid-brain</td><td>Some involuntary actions</td></tr>
   <tr><td>Hind-brain: <mark>medulla</mark></td><td>Blood pressure, salivation, vomiting</td></tr>
   <tr><td>Hind-brain: <mark>cerebellum</mark></td><td>Precision of voluntary actions, posture and balance</td></tr></table></div>
   <p>The brain sits inside the skull in a fluid-filled balloon that absorbs shocks; the spinal cord is protected by the vertebral column.</p>`},
  {h:'Coordination in plants', b:`<p>Plants have no nerves, but they respond to stimuli.</p>
   <ul><li><b>Immediate response:</b> the leaves of the sensitive plant (<i>Mimosa</i>, touch-me-not) fold when touched, as cells change shape by moving water.</li>
   <li><b>Growth responses (<mark>tropisms</mark>):</b> shoots bend toward light (phototropism); roots grow down with gravity (geotropism) and toward water (hydrotropism); pollen tubes grow toward ovules (chemotropism).</li></ul>
   <p>Plant hormones: <mark>auxin</mark> makes cells grow longer on the shaded side, so shoots bend toward light; <b>gibberellins</b> help stems grow; <b>cytokinins</b> promote cell division; <b>abscisic acid</b> inhibits growth and causes wilting of leaves.</p>`},
  {h:'Hormones in animals', b:`<div class="tbl"><table><tr><th>Hormone</th><th>Gland</th><th>Job</th></tr>
   <tr><td>Adrenaline</td><td>Adrenal</td><td>Prepares the body for an emergency: faster heartbeat, more oxygen to muscles</td></tr>
   <tr><td>Thyroxin</td><td>Thyroid</td><td>Regulates metabolism. Needs iodine; lack of iodine causes <mark>goitre</mark>, hence iodised salt</td></tr>
   <tr><td>Growth hormone</td><td>Pituitary</td><td>Growth. Too little in childhood causes dwarfism</td></tr>
   <tr><td>Insulin</td><td>Pancreas</td><td>Controls blood sugar. Too little causes diabetes</td></tr>
   <tr><td>Testosterone / oestrogen</td><td>Testes / ovaries</td><td>Changes at puberty</td></tr></table></div>
   <p>The amount and timing of hormones is controlled by <mark>feedback mechanisms</mark>. When blood sugar rises, the pancreas releases more insulin; as sugar falls, insulin release drops.</p>`}

C['sci-7'] = {
 notes:[
  {h:'Why organisms reproduce', b:`<p>Reproduction is not needed to keep one organism alive, but it keeps the species going. The key step is copying <mark>DNA</mark>, the information for making proteins. Copying is never perfect, so small changes appear. This <mark>variation</mark> helps a species survive when the environment changes, for example if water gets hotter.</p>`},
  {h:'Asexual reproduction', b:`<div class="tbl"><table><tr><th>Method</th><th>Example</th></tr>
   <tr><td><mark>Binary fission</mark>: one cell splits into two</td><td>Amoeba (any plane), Leishmania (a definite plane)</td></tr>
   <tr><td><mark>Multiple fission</mark>: one cell splits into many</td><td>Plasmodium, the malaria parasite</td></tr>
   <tr><td><mark>Fragmentation</mark>: body breaks into pieces that each grow</td><td>Spirogyra</td></tr>
   <tr><td><mark>Regeneration</mark>: a whole body grows from a cut piece, using specialised cells</td><td>Planaria, Hydra</td></tr>
   <tr><td><mark>Budding</mark>: an outgrowth detaches and grows</td><td>Hydra</td></tr>
   <tr><td><mark>Spore formation</mark>: tiny spores in sporangia</td><td>Rhizopus (bread mould)</td></tr>
   <tr><td><mark>Vegetative propagation</mark>: new plants from roots, stems or leaves</td><td>Buds on Bryophyllum leaves; sugarcane, rose, grapes by layering or grafting</td></tr></table></div>
   <p>Vegetative propagation helps grow plants such as banana, orange, rose and jasmine that have lost the capacity to produce seeds, and all the new plants are genetically like the parent.</p>`},
  {h:'Sexual reproduction in flowering plants', b:`<p>Sexual reproduction mixes DNA from two parents, giving more variation. Germ cells have half the DNA of body cells, so the zygote gets the right amount.</p>
   <ul><li><b>Stamen</b> (male): the anther makes pollen grains.</li><li><b>Pistil</b> (female): stigma, style and ovary; the ovary holds ovules with egg cells.</li></ul>
   <p>Transfer of pollen to the stigma is <mark>pollination</mark> (by wind, water or animals). A <b>pollen tube</b> grows down the style to the ovule, and the male germ cell fuses with the egg: <mark>fertilisation</mark>. The zygote becomes the embryo, the ovule becomes the <b>seed</b>, and the ovary becomes the <b>fruit</b>. See the flower in the Scanner tab.</p>`},
  {h:'Reproduction in human beings', b:`<p>At <mark>puberty</mark>, the body changes and becomes able to reproduce.</p>
   <ul><li><b>Male:</b> the testes make sperm and the hormone testosterone. They sit outside the body in the scrotum because sperm form at a lower temperature.</li>
   <li><b>Female:</b> the ovaries release one egg each month. The egg travels down the oviduct (fallopian tube), where fertilisation can happen. The fertilised egg implants in the wall of the uterus.</li></ul>
   <p>The embryo gets food and oxygen from the mother through the <mark>placenta</mark>, a disc embedded in the uterine wall. If the egg is not fertilised, the thick, blood-rich lining of the uterus breaks down and comes out as <mark>menstruation</mark>.</p>`},
  {h:'Reproductive health', b:`<p>Sexual contact can spread diseases such as gonorrhoea, syphilis, warts and HIV-AIDS. Pregnancy can be prevented by <b>contraception</b>: barrier methods such as condoms (which also protect against infection), hormonal pills, devices placed in the uterus, or surgery.</p>
   <p>Sex-selective abortion of female foetuses is illegal in India. It has lowered the child sex ratio, and a healthy society needs a balanced one.</p>`}

C['sci-8'] = {
 notes:[
  {h:'Inherited traits', b:`<p>Children look like their parents but not exactly. Rules of <mark>heredity</mark> decide how traits are passed on. Both parents contribute practically equal amounts of genetic material to the child, so each trait is influenced by DNA from both.</p>`},
  {h:"Mendel's experiments", b:`<p>Gregor Johann <mark>Mendel</mark> crossed garden pea plants with contrasting traits: tall/short plants, round/wrinkled seeds, white/violet flowers.</p>
   <ul><li>Crossing tall (TT) with short (tt) gave an <b>F1</b> generation of all tall plants. No medium-height plants appeared.</li>
   <li>Self-pollinating the F1 gave an <b>F2</b> generation with tall and short plants in a ratio of <mark>3 : 1</mark>.</li></ul>
   <p>So each plant carries two copies of the factor (now called a <mark>gene</mark>) for height. The trait that shows in F1 is <mark>dominant</mark> (tall); the hidden one is <mark>recessive</mark> (short). A plant is short only if both copies are t. Try the crosses in the Lab.</p>
   <p>With two traits together (round-yellow × wrinkled-green), new combinations appeared in F2, showing that traits are inherited <b>independently</b>.</p>`},
  {h:'How traits are expressed', b:`<p>A gene is a section of DNA that carries the information for a protein. For height, a gene can make an enzyme that controls a plant hormone: an efficient enzyme means more hormone and a taller plant.</p>
   <p>Genes are on <mark>chromosomes</mark>. Each germ cell gets one copy of each chromosome pair, so the offspring gets one set from each parent.</p>`},
  {h:'Sex determination', b:`<p>In some animals, the temperature at which eggs are kept decides the sex; in some snails, individuals can change sex. In humans, sex is decided by genes.</p>
   <p>Women have a matching pair of sex chromosomes, <mark>XX</mark>. Men have a mismatched pair, <mark>XY</mark>. Every child gets an X from the mother. A child who gets an X from the father is a girl; one who gets a Y is a boy. So the father's chromosome decides the sex of the child.</p>`}
 ],
