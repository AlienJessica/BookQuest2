  const a=sel;sel=null;a.classList.remove('sel');
  if(a.dataset.i===b.dataset.i){a.classList.add('ok');b.classList.add('ok');a.disabled=b.disabled=true;got++;beep('ok');msg.textContent=got===n?T.allDone:T.correct;if(got===n&&onDone)onDone(miss);}
  else{miss++;[a,b].forEach(x=>{x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),450);});beep('bad');msg.textContent=T.tryAgain;}});}
function c4Order(box,items,T,onDone){const idx=shuffle(items.map((_,i)=>i));let next=0,miss=0;
 const draw=()=>{box.innerHTML=`<ol class="g4-line">${items.slice(0,next).map(t=>`<li>${t}</li>`).join('')}</ol>${next<items.length?`<div class="g4-pool">${idx.filter(i=>i>=next).map(i=>`<button class="g4-c" data-i="${i}">${items[i]}</button>`).join('')}</div>`:''}<p class="g4-msg" aria-live="polite">${next===items.length?T.allDone:T.orderHint(T.num(next+1))}</p>`;
  box.querySelectorAll('.g4-pool .g4-c').forEach(b=>b.onclick=()=>{if(+b.dataset.i===next){next++;beep('ok');draw();if(next===items.length&&onDone)onDone(miss);}else{miss++;b.classList.add('bad');beep('bad');setTimeout(()=>b.classList.remove('bad'),450);}});};draw();}
function c4Who(box,who,T,onDone){const sp=[...new Set(who.map(w=>w[1]))];let k=0;
 const draw=()=>{if(k>=who.length){box.innerHTML=`<p class="g4-msg">${T.allDone}</p>`;if(onDone)onDone();return;}const w=who[k];
  box.innerHTML=`<blockquote class="g4-quote">“${w[0]}”</blockquote><div class="g4-opts">${shuffle(sp).map(s=>`<button class="g4-c" data-s="${esc(s)}">${s}</button>`).join('')}</div><p class="g4-msg" aria-live="polite">${T.num(k+1)} / ${T.num(who.length)}</p>`;
  box.querySelectorAll('.g4-opts .g4-c').forEach(b=>b.onclick=()=>{if(b.dataset.s===w[1]){b.classList.add('ok');beep('ok');k++;setTimeout(draw,550);}else{b.classList.add('bad');beep('bad');setTimeout(()=>b.classList.remove('bad'),450);}});};draw();}
function c4Quiz(box,qs,T,onDone){let k=0,score=0;const items=qs.map(q=>({...q,sh:shuffle(q.opts.map((o,i)=>[o,i===0]))}));
 const draw=()=>{if(k>=items.length){box.innerHTML=`<div class="g4-end"><b>${T.score}: ${T.num(score)} / ${T.num(items.length)}</b><p>${score===items.length?T.perfect:score>=items.length*0.6?T.good:T.keep}</p><button class="btn red g4-again">${T.again}</button></div>`;if(score===items.length&&!RM)confetti();
   box.querySelector('.g4-again').onclick=()=>{k=0;score=0;items.forEach(it=>it.sh=shuffle(it.sh));draw();};if(onDone)onDone(score,items.length);return;}
  const it=items[k];box.innerHTML=`<div class="g4-qh"><span>${T.num(k+1)} / ${T.num(items.length)}</span><span>${T.score}: ${T.num(score)}</span></div>${it.tag?`<span class="g4-tag">${it.tag}</span>`:''}<p class="g4-qq">${it.q.replace('___','<span class="g4-blank">______</span>')}</p><div class="g4-opts">${it.sh.map(([o,c])=>`<button class="g4-c" data-c="${c?1:0}">${o}</button>`).join('')}</div><p class="g4-msg" aria-live="polite"></p>`;
  box.querySelectorAll('.g4-opts .g4-c').forEach(b=>b.onclick=()=>{const ok=b.dataset.c==='1';box.querySelectorAll('.g4-opts .g4-c').forEach(x=>{x.disabled=true;if(x.dataset.c==='1')x.classList.add('ok');});if(!ok)b.classList.add('bad');else score++;beep(ok?'ok':'bad');
   const bl=box.querySelector('.g4-blank');if(bl)bl.textContent=items[k].opts[0];
   const m=box.querySelector('.g4-msg');m.textContent=ok?T.correct:T.wrongShow;const nx=document.createElement('button');nx.className='btn g4-next';nx.textContent=k+1<items.length?T.nextQ:T.finish;nx.onclick=()=>{k++;draw();};m.after(nx);nx.focus({preventScroll:true});});};draw();}
function c4QA(box,qa,T,onDone){let seen=0;box.innerHTML=`<p class="mini">${T.qaTip}</p><ol class="g4-qa">${qa.map((x,i)=>`<li><p class="g4-qq">${x[0]}</p><button class="tool g4-show">${T.show}</button><div class="g4-ans" hidden><p>${x[1]}</p></div></li>`).join('')}</ol>`;
 box.querySelectorAll('.g4-show').forEach(b=>b.onclick=()=>{b.nextElementSibling.hidden=false;b.remove();seen++;beep('page');if(seen===qa.length&&onDone)onDone();});}
function c4Puz(box,puz,T,onDone){let k=0;const draw=()=>{if(k>=puz.length){box.innerHTML=`<p class="g4-msg">${T.allDone}</p>`;if(onDone)onDone();return;}const [key,q,opts]=puz[k];
 box.innerHTML=`<div class="g4-puz"><svg viewBox="0 0 200 140" role="img" aria-label="${esc(q)}">${c4PuzArt(key,false)}</svg></div><p class="g4-qq">${q}</p><div class="g4-opts">${shuffle(opts.map((o,i)=>[o,i===0])).map(([o,c])=>`<button class="g4-c" data-c="${c?1:0}">${o}</button>`).join('')}</div><p class="g4-msg" aria-live="polite">${T.num(k+1)} / ${T.num(puz.length)}</p>`;
 box.querySelectorAll('.g4-c').forEach(b=>b.onclick=()=>{if(b.dataset.c==='1'){b.classList.add('ok');beep('ok');box.querySelector('svg').innerHTML=c4PuzArt(key,true);box.querySelector('.g4-msg').textContent=T.correct;setTimeout(()=>{k++;draw();},1100);}else{b.classList.add('bad');beep('bad');setTimeout(()=>b.classList.remove('bad'),450);}});};draw();}
function c4Speak(text,lang,btn,T){const ss=window.speechSynthesis;if(!ss){alert(T.noVoice);return;}if(ss.speaking){ss.cancel();btn.textContent=T.listen;return;}
 const want=lang==='bn'?/^bn/i:/^en/i,v=ss.getVoices().find(x=>want.test(x.lang));if(lang==='bn'&&!v){const n=btn.parentNode.parentNode.querySelector('.c4-novoice');if(n)n.hidden=false;return;}
 const u=new SpeechSynthesisUtterance(text);u.lang=lang==='bn'?'bn-IN':'en-IN';if(v)u.voice=v;u.rate=0.92;u.onend=()=>{btn.textContent=T.listen;};btn.textContent=T.stop;ss.speak(u);}
const c4Nanu=(t,T)=>`<div class="bubble who-nanu r c4-nanu"><div class="av">${face('nanu')}</div><div class="b"><span class="nm">${T.nanu}</span>${t}</div></div>`;

  <p class="note">${T.ownWords}</p></div>`;window.scrollTo(0,0);}
function viewC4Lesson(id){const p=C4P.find(x=>x.id===id);if(!p||!C4_LIVE){location.hash='class-4';return;}const b=c4Bk(p),T=C4TXT[b.lang],ps=b.pieces(),ix=ps.indexOf(p),u=b.units().find(x=>x.u===p.u);

  <div class="tabs" role="tablist">${tabs.map((t,i)=>`<button class="tab" role="tab" data-t="${t[0]}" aria-selected="${i===0}">${t[1]}</button>`).join('')}</div><div id="c4pane"></div>
  <div class="c4-nav">${ix>0?`<a class="btn ghost" href="#${ps[ix-1].id}">← ${T.prev}</a>`:'<span></span>'}${ix<ps.length-1?`<a class="btn" href="#${ps[ix+1].id}">${T.next} →</a>`:`<a class="btn" href="#c4-${b.id}">${b.t}</a>`}</div></div>`;
 c4Prog(p);
 const show=t=>{document.querySelectorAll('.c4 .tab').forEach(x=>x.setAttribute('aria-selected',x.dataset.t===t));const pane=$('#c4pane');try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}

    ${p.auth?`<section class="c4-box"><h2>${T.author}</h2><p>${p.auth}</p></section>`:''}
    <section class="c4-box"><h2>${T.words}</h2><dl class="c4-words">${p.words.map(w=>`<div><dt>${w[0]}</dt><dd>${w[1]}</dd></div>`).join('')}</dl></section>${c4Nanu(T.readFirst,T)}</div>`;
   pane.querySelector('.c4-say').onclick=e=>c4Speak(p.sum,b.lang,e.currentTarget,T);c4Mark(p,'read');}

/* ---------------- Router ---------------- */
function route(){
  const h=location.hash.slice(1);
  const s=SUBJECTS.find(x=>x.id===h);
  if(!h) viewLanding(); else if(h==='class-10') viewHome(); else if(h==='class-4') viewClass4(); else if(h.startsWith('c4t-')) viewC4Test(h.slice(4)); else if(h.startsWith('c4-')&&C4BOOKS[h.slice(3)]) viewC4Book(h.slice(3)); else if(/^(c4|e4)-\d/.test(h)) viewC4Lesson(h); else if(h==='books') viewBooks(); else if(h==='lab') viewLabPage(); else if(h==='labs') viewLabsHub(); else if(h.startsWith('lab-')) viewVLab(h.slice(4)); else if(s) viewSubject(s); else viewChapter(h);
  if(!h||s) window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
