C['sci-9'] = {
 notes:[
  {h:'Reflection of light', b:`<p>Light travels in straight lines. When it falls on a polished surface:</p>
   <ul><li>The angle of incidence equals the angle of reflection.</li><li>The incident ray, the normal and the reflected ray lie in the same plane.</li></ul>
   <p>A plane mirror forms a virtual, erect image as far behind the mirror as the object is in front, the same size, laterally inverted.</p>`},
  {h:'Spherical mirrors', b:`<p>A <mark>concave mirror</mark> curves inward; a <mark>convex mirror</mark> bulges outward. Key terms: <b>pole</b> (P, centre of the mirror), <b>centre of curvature</b> (C), <b>principal axis</b>, <b>principal focus</b> (F) and <b>focal length</b> (f). For small mirrors, <mark>R = 2f</mark>.</p>
   <div class="tbl"><table><tr><th>Mirror</th><th>Images</th><th>Uses</th></tr>
   <tr><td>Concave</td><td>Real and inverted, except when the object is between P and F (virtual, erect, enlarged)</td><td>Torches and headlights, shaving mirrors, dentists' mirrors, solar furnaces</td></tr>
   <tr><td>Convex</td><td>Always virtual, erect and diminished</td><td>Rear-view mirrors in vehicles: wider field of view</td></tr></table></div>
   <div class="eq">Mirror formula: 1/v + 1/u = 1/f &nbsp;&nbsp; Magnification: m = h′/h = −v/u</div>
   <p><b>Sign convention:</b> distances are measured from the pole; those in the direction of incident light are positive, those against it negative. Heights above the axis are positive.</p>`},
  {h:'Refraction of light', b:`<p>Light bends when it passes from one medium to another, because its speed changes. Through a glass slab, the emergent ray is parallel to the incident ray but shifted sideways.</p>
   <ul><li>The incident ray, refracted ray and normal lie in one plane.</li><li><mark>Snell's law</mark>: sin i / sin r is constant for a given pair of media.</li></ul>
   <p>The <mark>refractive index</mark> n = speed of light in vacuum ÷ speed in the medium. Light travels at 3 × 10⁸ m/s in vacuum. Water has n = 1.33, crown glass 1.52 and diamond 2.42, so light is slowest in diamond.</p>`},
  {h:'Spherical lenses', b:`<p>A <mark>convex lens</mark> (converging) is thicker in the middle; a <mark>concave lens</mark> (diverging) is thicker at the edges. The centre of a lens is its <b>optical centre</b> (O); a ray through it goes straight on.</p>
   <div class="tbl"><table><tr><th>Object position (convex lens)</th><th>Image</th></tr>
   <tr><td>Beyond 2F₁</td><td>Between F₂ and 2F₂; real, inverted, diminished</td></tr>
   <tr><td>At 2F₁</td><td>At 2F₂; real, inverted, same size</td></tr>
   <tr><td>Between F₁ and 2F₁</td><td>Beyond 2F₂; real, inverted, enlarged</td></tr>
   <tr><td>At F₁</td><td>At infinity</td></tr>
   <tr><td>Between F₁ and O</td><td>Same side as object; virtual, erect, enlarged (magnifying glass)</td></tr></table></div>
   <p>A concave lens always gives a virtual, erect, diminished image. Move the object yourself in the Lab.</p>`},
  {h:'Lens formula and power', b:`<div class="eq">Lens formula: 1/v − 1/u = 1/f &nbsp;&nbsp; Magnification: m = h′/h = v/u</div>
   <p>The <mark>power</mark> of a lens is how strongly it bends light: <b>P = 1/f</b>, with f in metres. The unit is the <mark>dioptre</mark> (D): a lens with a focal length of 1 m has a power of 1 D. Convex lenses have positive power, concave lenses negative. Powers of lenses in contact add up.</p>
   <div class="tip"><b>Example</b>A concave lens with f = −2 m has P = 1/(−2) = −0.5 D.</div>`}

C['sci-12'] = {
 notes:[
  {h:'Magnetic field and field lines', b:`<p>A compass needle is a small magnet; its north-seeking end points north. The region around a magnet where its force can be felt is its <mark>magnetic field</mark>, shown by <mark>field lines</mark>.</p>
   <ul><li>Outside the magnet, field lines go from the north pole to the south pole; inside, from south to north. They are closed loops.</li>
   <li>Lines are crowded where the field is strong.</li><li>Two field lines never cross, because the field cannot point in two directions at one place.</li></ul>`},
  {h:'Current makes a magnetic field', b:`<p>In 1820, <mark>Hans Christian Oersted</mark> noticed a compass needle deflecting near a wire carrying current. Electricity and magnetism are linked.</p>
   <ul><li><b>Straight wire:</b> field lines are circles around the wire. The field is stronger close to the wire and with more current.</li>
   <li><mark>Right-hand thumb rule</mark>: hold the wire in your right hand with the thumb along the current; your curled fingers show the direction of the field.</li>
   <li><b>Circular loop:</b> the field lines near the centre are almost straight. More turns give a stronger field.</li>
   <li><mark>Solenoid</mark>: a long coil of many turns. Inside it the field is uniform, like a bar magnet. With a soft iron core it becomes an <b>electromagnet</b>.</li></ul>`},
  {h:'Force on a current-carrying conductor', b:`<p>A wire carrying current in a magnetic field feels a force. The force is greatest when the current is at right angles to the field, and reverses if the current or the field is reversed.</p>
   <p><mark>Fleming's left-hand rule</mark>: stretch the thumb, forefinger and middle finger of your left hand so they are mutually perpendicular. If the <b>forefinger</b> points along the field and the <b>middle finger</b> along the current, the <b>thumb</b> shows the direction of the force (motion).</p>
   <p>Electric motors, loudspeakers and many other devices use this force. Inside the body, nerve impulses also produce weak magnetic fields, which MRI scans use to make images.</p>`},
  {h:'Domestic electric circuits', b:`<p>Homes in India get <mark>AC at 220 V and 50 Hz</mark>. Three wires come in:</p>
   <div class="tbl"><table><tr><th>Wire</th><th>Insulation</th><th>Role</th></tr>
   <tr><td>Live</td><td>Red</td><td>At 220 V</td></tr><tr><td>Neutral</td><td>Black</td><td>At 0 V; completes the circuit</td></tr>
   <tr><td><mark>Earth</mark></td><td>Green</td><td>Connected to a metal plate deep in the ground; joined to metal bodies of appliances so a leak goes to earth instead of through you</td></tr></table></div>
   <p>There are usually two circuits: a <b>15 A</b> one for high-power appliances like geysers and air coolers, and a <b>5 A</b> one for bulbs and fans. Appliances are connected in parallel.</p>
   <p><mark>Short-circuiting</mark> happens when live and neutral touch; <mark>overloading</mark> when too many appliances are on one socket or the voltage spikes. A <b>fuse</b> melts and breaks the circuit to prevent damage.</p>`}

C['sci-13'] = {
 notes:[
  {h:'Ecosystems', b:`<p>All the living things in an area plus the non-living parts (temperature, rain, wind, soil, minerals) form an <mark>ecosystem</mark>. A garden, a pond and a forest are natural ecosystems; a crop field or an aquarium is human-made.</p>
   <ul><li><mark>Producers</mark>: green plants that make food by photosynthesis.</li>
   <li><mark>Consumers</mark>: herbivores, carnivores, omnivores and parasites that eat other organisms.</li>
   <li><mark>Decomposers</mark>: bacteria and fungi that break down dead remains and return nutrients to the soil.</li></ul>`},
  {h:'Food chains and energy flow', b:`<p>A series of organisms eating one another is a <mark>food chain</mark>; each step is a <mark>trophic level</mark>. Food chains link up into a <b>food web</b>.</p>
   <ul><li>Green plants capture only about <b>1%</b> of the sunlight falling on their leaves.</li>
   <li>On average only <mark>10%</mark> of the energy at one level reaches the next; the rest is used for life processes or lost as heat.</li>
   <li>So food chains usually have only 3 or 4 steps, and there are fewer organisms at the higher levels.</li>
   <li>Energy flow is <b>one-way</b>: it does not come back to the producers.</li></ul>
   <p>Try the 10% rule in the Lab.</p>`},
  {h:'Biological magnification', b:`<p>Pesticides sprayed on crops are washed into soil and water. Plants absorb them, and they pass up the food chain. Since they cannot be broken down, they build up at each level. This is <mark>biological magnification</mark>. Human beings, at the top of many food chains, carry the highest concentrations.</p>`},
  {h:'The ozone layer', b:`<p><mark>Ozone</mark> (O₃) high in the atmosphere shields the Earth from the Sun's harmful <b>ultraviolet (UV)</b> radiation, which can cause skin cancer. Ozone forms when UV splits O₂ into single oxygen atoms, which join with O₂.</p>
   <p>The ozone layer began thinning in the 1980s, mainly because of <mark>chlorofluorocarbons (CFCs)</mark> used in refrigerators and fire extinguishers. In 1987 the United Nations Environment Programme (UNEP) got countries to agree to freeze CFC production at 1986 levels.</p>`},
  {h:'Managing our garbage', b:`<p>Substances broken down by bacteria and other decomposers are <mark>biodegradable</mark> (vegetable peels, paper, cotton). Those that are not are <mark>non-biodegradable</mark> (plastics, glass, many pesticides). Non-biodegradable waste stays in the environment for a long time and harms living things.</p>
   <p>Our lifestyles produce more garbage every year, much of it packaging. Separate wet and dry waste, compost what you can, and reduce, reuse and recycle the rest.</p>`}

function viewChapter(id){
  const f=findChapter(id); if(!f||!C[id]){location.hash='';return;}
  const {s,c}=f, d=C[id];
  P.last=id; P.lastAny={h:id,t:c.t}; save();
  $('#crumbs').innerHTML=`<a href="#">Home</a> / <a href="#class-10">Class 10</a> / <a href="#${s.id}">${s.name}</a> / <span class="${d.hi?'hi':''}">${esc(c.t)}</span>`;
  const tabs=[d.story?['story','Story']:['voyage','Explore']];
  if(d.pics) tabs.push(['pics','Pictures']);
  if(d.vlab) tabs.push(['vlab','Virtual lab']);
  if(d.widget) tabs.push(['lab',d.widget==='chemlab'?'Virtual lab':d.widget==='sort'?'Sort game':'Lab']);
  tabs.push(['notes','Revise'],['quiz','Test']);
  $('#app').innerHTML=`<div style="--c:var(${s.c})" class="${d.hi?'hi':''}">
   <div class="chead"><div class="eyebrow">${esc(s.name)}${c.book.name!==s.name?' · '+esc(c.book.name):''} · Chapter ${c.n}</div><h1>${esc(c.t)}</h1>${d.story?`<p class="sub">Episode ${d.story.no}: ${d.story.title}</p>`:''}</div>
   <div class="tabs" role="tablist">${tabs.map((t,i)=>`<button class="tab" role="tab" id="tab-${t[0]}" aria-selected="${i===0}" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
   <div id="pane"></div></div>`;
  const show=t=>{clearInterval(typeTimer);document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===t));
    ({story:paneStory,voyage:paneVoyage,quiz:paneQuiz,lab:paneLab,vlab:paneVLab,pics:panePics,notes:paneNotes})[t](id,d);};
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(b.dataset.t));
  show(tabs[0][0]); window.scrollTo(0,0);
}

function paneNotes(id,d){
  $('#pane').innerHTML=`<div class="layout"><article class="notes">${d.notes.map((n,i)=>`<section><h2 id="n${i}">${n.h}</h2>${n.b}</section>`).join('')}
   <div class="donebar"><button class="btn red" id="goQuiz">Take the chapter test</button><button class="btn ghost" id="markDone">${P.done[id]?'✓ Marked as done':'Mark chapter as done'}</button></div></article>
   <nav class="toc" aria-label="On this page">${d.notes.map((n,i)=>`<a href="javascript:void 0" data-i="${i}">${n.h}</a>`).join('')}</nav></div>`;
  document.querySelectorAll('.toc a').forEach(a=>a.onclick=()=>document.getElementById('n'+a.dataset.i).scrollIntoView({behavior:'smooth'}));
  $('#goQuiz').onclick=()=>$('#tab-quiz').click();
  $('#markDone').onclick=e=>{P.done[id]=!P.done[id];save();e.target.textContent=P.done[id]?'✓ Marked as done':'Mark chapter as done';};
}

function paneQuiz(id,d){
  const qs=d.quiz; let got=0, answered=0;
  $('#pane').innerHTML=`<div class="quiz">${qs.map((q,qi)=>`<div class="q" data-q="${qi}"><h3><span>Q${qi+1}</span>${q[0]}</h3><div class="opts">${q[1].map((o,oi)=>`<button class="opt" data-o="${oi}">${o}</button>`).join('')}</div><div class="why" hidden></div></div>`).join('')}
   <div class="score"><span class="num" id="sc">0 / ${qs.length}</span><span id="msg" style="color:var(--muted)">${d.hi?'हर प्रश्न का उत्तर चुनें।':'Answer every question to finish.'}</span><button class="btn ghost" id="retry" style="margin-left:auto">${d.hi?'फिर से':'Retry'}</button></div></div>`;
  document.querySelectorAll('.q').forEach(el=>{const q=qs[+el.dataset.q];
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=+b.dataset.o; el.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      el.querySelector(`[data-o="${q[2]}"]`).classList.add('right');
      if(o===q[2]){got++;}else b.classList.add('wrong');
      const w=el.querySelector('.why'); w.hidden=false; w.innerHTML=(o===q[2]?'<span class="ok">✓ Correct.</span> ':'<span class="no">✗ Not quite.</span> ')+q[3];
      answered++; $('#sc').textContent=`${got} / ${qs.length}`;
      if(answered===qs.length){
        const best=P.score[id]; if(!best||got>best[0]) P.score[id]=[got,qs.length];
        if(got/qs.length>=0.6) P.done[id]=true; save();
        $('#msg').textContent= got===qs.length?'Full marks! Chapter marked as done.': got/qs.length>=0.6?'Good work. Chapter marked as done. Review the ones you missed.':'Read the notes once more and try again.';
      }});});
  $('#retry').onclick=()=>paneQuiz(id,d);
}

function panePics(id,d){
  let pi=0, mode='learn', sel=0, target=null, left=[], firstTry=0, missed=false;
  const startTest=()=>{left=shuffle(PICS[d.pics[pi]].spots.map((_,i)=>i));target=left.pop();firstTry=0;missed=false;};
  const render=()=>{const P0=PICS[d.pics[pi]], S=P0.spots, found=mode==='test'?S.map((_,i)=>i!==target&&!left.includes(i)):[];
   const done=mode==='test'&&target===null;
   $('#pane').innerHTML=`<div class="lab">
    ${d.pics.length>1?`<div class="chipset">${d.pics.map((k,i)=>`<button class="chip ${i===pi?'on':''}" data-p="${i}">${PICS[k].title}</button>`).join('')}</div>`:''}
    <div class="row" style="justify-content:space-between"><div><h3>${P0.title}</h3><p>${P0.desc}</p></div>
     <div class="seg" role="group" aria-label="Mode"><button data-m="learn" aria-pressed="${mode==='learn'}">Learn</button><button data-m="test" aria-pressed="${mode==='test'}">Test me</button></div></div>
    <div class="pics"><div class="svgbox"><svg viewBox="${P0.vb}" width="${P0.vb.split(' ')[2]}" role="img" aria-label="${P0.title}">${P0.svg}
     ${S.map((s,i)=>`<g class="pin ${mode==='learn'&&i===sel?'on':''} ${found[i]?'found':''}" data-i="${i}" tabindex="0" role="button" aria-label="${mode==='learn'?s[2]:'Point '+(i+1)}"><circle cx="${s[0]}" cy="${s[1]}" r="11"/><text x="${s[0]}" y="${s[1]+4}" text-anchor="middle">${i+1}</text></g>`).join('')}</svg></div>
     <div class="info" id="info">${mode==='learn'
       ?`<div class="eyebrow">Part ${sel+1} of ${S.length}</div><h4>${S[sel][2]}</h4><div>${S[sel][3]}</div><div class="labels">${S.map((s,i)=>`<button data-l="${i}" class="${i===sel?'on':''}">${i+1}. ${s[2]}</button>`).join('')}</div>`
       :done?`<h4>All ${S.length} found</h4><div>${firstTry} of ${S.length} right on the first tap.</div><button class="btn ghost" id="again">Test again</button>`
       :`<div class="eyebrow">Tap the part</div><h4>${S[target][2]}</h4><div id="fb" style="color:var(--muted)">${S.length-left.length-1} of ${S.length} found</div>`}</div></div></div>`;
   const pick=i=>{ if(mode==='learn'){sel=i;render();return;}
     if(done) return;
     if(i===target){ if(!missed) firstTry++; missed=false; target=left.length?left.pop():null; render(); }
     else { missed=true; const g=$('#pane').querySelector(`.pin[data-i="${i}"]`); g.classList.add('miss'); setTimeout(()=>g.classList.remove('miss'),450);
       $('#fb').innerHTML=`<span class="no">That is ${S[i][2]}.</span> Try again.`; } };
   $('#pane').querySelectorAll('.pin').forEach(g=>{g.onclick=()=>pick(+g.dataset.i);g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(+g.dataset.i);}};});
   $('#pane').querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>pick(+b.dataset.l));
   $('#pane').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pi=+b.dataset.p;sel=0;if(mode==='test')startTest();render();});
   $('#pane').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;sel=0;if(mode==='test')startTest();render();});
   const ag=$('#again'); if(ag) ag.onclick=()=>{startTest();render();};
  };
  render();
}

const sub=f=>f.replace(/(\d+)/g,'<sub>$1</sub>');
const LABS={
 balance(el){
  const EQS=[
   {r:[['H2',{H:2}],['O2',{O:2}]],p:[['H2O',{H:2,O:1}]]},
   {r:[['Mg',{Mg:1}],['O2',{O:2}]],p:[['MgO',{Mg:1,O:1}]]},
   {r:[['Fe',{Fe:1}],['H2O',{H:2,O:1}]],p:[['Fe3O4',{Fe:3,O:4}],['H2',{H:2}]]},
   {r:[['Na',{Na:1}],['H2O',{H:2,O:1}]],p:[['NaOH',{Na:1,O:1,H:1}],['H2',{H:2}]]},
   {r:[['CH4',{C:1,H:4}],['O2',{O:2}]],p:[['CO2',{C:1,O:2}],['H2O',{H:2,O:1}]]}];
  let k=0, co;
  const render=()=>{const e=EQS[k]; if(!co) co=[...e.r,...e.p].map(()=>1);
   const all=[...e.r,...e.p]; const els=[...new Set(all.flatMap(x=>Object.keys(x[1])))];
   const count=(side,off)=>{const m={};side.forEach((x,i)=>Object.entries(x[1]).forEach(([a,n])=>m[a]=(m[a]||0)+n*co[off+i]));return m;};
   const L=count(e.r,0), R=count(e.p,e.r.length); const ok=els.every(a=>L[a]===R[a]);
   const term=(x,i)=>`<span class="step"><button aria-label="less" data-i="${i}" data-d="-1">−</button><b>${co[i]}</b><button aria-label="more" data-i="${i}" data-d="1">+</button></span><span class="formula">${sub(x[0])}</span>`;
   el.innerHTML=`<h3>Balance the equation</h3><p>Use + and − to change the coefficients until every element has the same number of atoms on both sides.</p>
    <div class="chipset">${EQS.map((q,i)=>`<button class="chip ${i===k?'on':''}" data-k="${i}">${i+1}</button>`).join('')}</div>
    <div class="eqline">${e.r.map((x,i)=>term(x,i)).join(' + ')} → ${e.p.map((x,i)=>term(x,e.r.length+i)).join(' + ')}</div>
    <div class="tbl"><table><tr><th>Element</th><th>Left side</th><th>Right side</th><th></th></tr>${els.map(a=>`<tr><td>${a}</td><td class="num">${L[a]}</td><td class="num">${R[a]}</td><td>${L[a]===R[a]?'<span class="ok">✓</span>':'<span class="no">✗</span>'}</td></tr>`).join('')}</table></div>
    <div>${ok?'<span class="ok">Balanced! Atoms are conserved.</span>':'<span style="color:var(--muted)">Not balanced yet.</span>'}</div>`;
   el.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;co[i]=Math.min(9,Math.max(1,co[i]+ +b.dataset.d));render();});
   el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{k=+b.dataset.k;co=null;render();});
  };render();
 },
 ohm(el){
  el.innerHTML=`<h3>Ohm's law circuit</h3><p>Change the battery voltage and the resistance. Watch the current and the bulb's brightness.</p>
   <div class="svgbox"><svg viewBox="0 0 420 200" width="420" role="img" aria-label="Circuit with battery, resistor and bulb">
    <rect x="40" y="30" width="340" height="140" rx="10" fill="none" stroke="var(--line)" stroke-width="6"/>

  ['#ov','#or','#r1','#r2'].forEach(s=>$(s).oninput=up);up();
 },
 ap(el){
  el.innerHTML=`<h3>AP explorer</h3><p>Pick the first term a, the common difference d and the number of terms n.</p>
   <div class="row"><div class="ctrl"><label for="aa">First term a <output id="aao"></output></label><input type="range" id="aa" min="-20" max="20" value="2"></div>
   <div class="ctrl"><label for="ad">Common difference d <output id="ado"></output></label><input type="range" id="ad" min="-10" max="10" value="3"></div>
   <div class="ctrl"><label for="an">Terms n <output id="ano"></output></label><input type="range" id="an" min="2" max="20" value="10"></div></div>
   <div class="chipset" id="terms"></div>
   <div class="svgbox"><svg id="apsvg" viewBox="0 0 420 180" width="420" role="img" aria-label="Bar chart of AP terms"></svg></div>
   <div class="readouts"><div class="ro"><span>aₙ = a + (n−1)d</span><b id="anv"></b></div><div class="ro"><span>Sₙ = n/2[2a+(n−1)d]</span><b id="snv"></b></div></div>`;
  const up=()=>{const a=+$('#aa').value,d=+$('#ad').value,n=+$('#an').value;$('#aao').textContent=a;$('#ado').textContent=d;$('#ano').textContent=n;
   const t=Array.from({length:n},(_,i)=>a+i*d);$('#terms').innerHTML=t.map(x=>`<span class="chip">${x}</span>`).join('');
   $('#anv').textContent=t[n-1];$('#snv').textContent=n*(2*a+(n-1)*d)/2;
   const m=Math.max(1,...t.map(Math.abs)),W=420,H=180,mid=H/2,bw=(W-20)/n;
   $('#apsvg').innerHTML=`<line x1="10" y1="${mid}" x2="${W-10}" y2="${mid}" stroke="var(--line)"/>`+t.map((x,i)=>{const h=Math.abs(x)/m*(mid-14);return `<rect x="${10+i*bw+2}" y="${x>=0?mid-h:mid}" width="${bw-4}" height="${Math.max(1,h)}" rx="2" fill="var(--c)" opacity="${.45+.55*(i+1)/n}"/>`}).join('');};
  ['#aa','#ad','#an'].forEach(s=>$(s).oninput=up);up();
 },
 trig(el){
  el.innerHTML=`<h3>Angle and ratios</h3><p>The hypotenuse is fixed at 1 unit. Move the angle and see how the opposite and adjacent sides change.</p>
   <div class="svgbox"><svg viewBox="0 0 360 240" width="360" id="tsvg" role="img" aria-label="Right triangle"></svg></div>
   <div class="row"><div class="ctrl"><label for="ta">Angle A <output id="tao"></output></label><input type="range" id="ta" min="1" max="89" value="30"></div>
   <div class="chipset">${[30,45,60].map(x=>`<button class="chip" data-a="${x}">${x}°</button>`).join('')}</div></div>
   <div class="readouts"><div class="ro"><span>sin A</span><b id="ts"></b></div><div class="ro"><span>cos A</span><b id="tc"></b></div><div class="ro"><span>tan A</span><b id="tt"></b></div><div class="ro"><span>sin²A + cos²A</span><b id="tid"></b></div></div>`;
  const up=()=>{const A=+$('#ta').value,r=A*Math.PI/180,s=Math.sin(r),c=Math.cos(r),L=220;
   const ax=40,ay=210,bx=ax+L*c,cy=ay-L*s;$('#tao').textContent=A+'°';
   $('#tsvg').innerHTML=`<polygon points="${ax},${ay} ${bx},${ay} ${bx},${cy}" fill="color-mix(in srgb,var(--c) 12%,transparent)" stroke="var(--c)" stroke-width="2.5"/>
    <rect x="${bx-12}" y="${ay-12}" width="12" height="12" fill="none" stroke="var(--muted)"/>
    <path d="M${ax+34},${ay} A34,34 0 0 0 ${ax+34*c},${ay-34*s}" fill="none" stroke="var(--ink)"/>
    <text x="${ax+40}" y="${ay-8}" font-size="13" fill="var(--ink)" font-family="JetBrains Mono, monospace">${A}°</text>
    <text x="${ax-4}" y="${ay+20}" font-size="14" fill="var(--ink)">A</text><text x="${bx-4}" y="${ay+20}" font-size="14" fill="var(--ink)">B</text><text x="${bx+6}" y="${cy+4}" font-size="14" fill="var(--ink)">C</text>
    <text x="${(ax+bx)/2}" y="${ay+20}" text-anchor="middle" font-size="12" fill="var(--muted)" font-family="JetBrains Mono, monospace">adj ${c.toFixed(2)}</text>

   $('#ts').textContent=s.toFixed(3);$('#tc').textContent=c.toFixed(3);$('#tt').textContent=(s/c).toFixed(3);$('#tid').textContent=(s*s+c*c).toFixed(3);};
  $('#ta').oninput=up; el.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{$('#ta').value=b.dataset.a;up();}); up();
 },
 order(el,d){
  const ev=d.order; let next=0, list=shuffle(ev.map((e,i)=>({e,i})));
  const render=()=>{el.innerHTML=`<h3>${d.orderTitle||'Put the events in order'}</h3><p>${d.orderHint||'Tap the events from earliest to latest.'} A wrong tap shakes.</p>
   <div style="display:grid;gap:8px">${list.map(x=>`<button class="evt ${x.i<next?'placed':''}" data-i="${x.i}" ${x.i<next?'disabled':''}><span class="yr">${x.i<next?x.e[0]:'????'}</span><span>${x.e[1]}</span></button>`).join('')}</div>
   <div>${next===ev.length?'<span class="ok">All in order! </span><button class="btn ghost" id="again">Play again</button>':`<span style="color:var(--muted)">${next} of ${ev.length} placed</span>`}</div>`;
   el.querySelectorAll('.evt').forEach(b=>b.onclick=()=>{if(+b.dataset.i===next){next++;render();}else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');}});
   const ag=el.querySelector('#again'); if(ag) ag.onclick=()=>{next=0;list=shuffle(list);render();};};
  render();
 },
 sort(el,d){
  const {cats,items}=d.sort; let ans={};
  const render=()=>{const done=Object.keys(ans).length, right=items.filter((it,i)=>ans[i]===it[1]).length;
   el.innerHTML=`<h3>Sort it</h3><p>Choose the right group for each item.</p>
   <div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">${items.map((it,i)=>{const a=ans[i];const st=a===undefined?'':a===it[1]?'right':'wrong';
    return `<div class="sortitem ${st}"><div>${it[0]}</div><div class="chipset">${cats.map((c,ci)=>`<button class="chip ${a===ci?'on':''}" data-i="${i}" data-c="${ci}" ${a!==undefined?'disabled':''}>${c}</button>`).join('')}</div>${st==='wrong'?`<small>Answer: ${cats[it[1]]}</small>`:''}</div>`}).join('')}</div>
   <div class="row"><span class="num" style="font:700 1.2rem var(--f-display)">${right} / ${items.length}</span>${done===items.length?'<button class="btn ghost" id="again">Try again</button>':''}</div>`;
   el.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{ans[+b.dataset.i]=+b.dataset.c;render();});
   const ag=el.querySelector('#again'); if(ag) ag.onclick=()=>{ans={};render();};};
  render();
 },
 income(el){

/* ---------------- Sound, page turns and helpers ---------------- */
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const SND={on:true};try{SND.on=localStorage.getItem('kitaab10-sound')!=='off';}catch(e){}
let AC=null;
function audio(){if(!SND.on)return null;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}return AC;}
function beep(type){const ac=audio();if(!ac)return;
 const T={scan:[700,1200,.12,'sine',.06],ok:[620,1240,.25,'triangle',.08],bad:[260,130,.3,'triangle',.06],tick:[700,700,.05,'square',.02],page:[420,200,.18,'triangle',.05],pop:[480,880,.09,'sine',.05],win:[880,1760,.35,'triangle',.08],flash:[200,1600,.9,'sawtooth',.025]}[type];
 if(!T)return;const t=ac.currentTime,o=ac.createOscillator(),v=ac.createGain();o.connect(v);v.connect(ac.destination);
 o.type=T[3];o.frequency.setValueAtTime(T[0],t);o.frequency.exponentialRampToValueAtTime(T[1],t+T[2]);
 v.gain.setValueAtTime(.0001,t);v.gain.exponentialRampToValueAtTime(T[4],t+.02);v.gain.exponentialRampToValueAtTime(.0001,t+T[2]);
 o.start(t);o.stop(t+T[2]+.05);}
function noise(d,vol){const ac=audio();if(!ac)return;const n=Math.floor(ac.sampleRate*d),b=ac.createBuffer(1,n,ac.sampleRate),a=b.getChannelData(0);
 for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);
 const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();f.type='highpass';f.frequency.value=1500;s.buffer=b;s.connect(f);f.connect(g);g.connect(ac.destination);g.gain.value=vol||.04;s.start();}
function sndLabel(){const b=document.getElementById('snd');if(b){b.textContent=SND.on?'Sound on':'Sound off';b.setAttribute('aria-pressed',SND.on);}}
document.getElementById('snd').onclick=()=>{SND.on=!SND.on;try{localStorage.setItem('kitaab10-sound',SND.on?'on':'off');}catch(e){}sndLabel();if(SND.on)beep('tick');};
sndLabel();

function tween(ms,fn,done){if(RM){fn(1);if(done)done();return;}const t0=performance.now();
 const tick=t=>{const k=Math.min(1,(t-t0)/ms);fn(k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2);if(k<1)requestAnimationFrame(tick);else if(done)done();};requestAnimationFrame(tick);}
const wait=(ms,f)=>setTimeout(f,RM?0:ms);
const rgbOf=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const mixc=(a,b,k)=>{const A=rgbOf(a),B=rgbOf(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*k).toString(16).padStart(2,'0')).join('');};

function turn(fn){beep('page');const p=document.getElementById('pane');
 const settle=()=>{const pp=document.getElementById('pane');if(!pp)return;const top=pp.getBoundingClientRect().top+scrollY-90;if(scrollY>top)window.scrollTo({top,behavior:RM?'auto':'smooth'});};
 if(RM||!p){fn();settle();return;}
 p.classList.remove('turn-in');p.classList.add('turn-out');
 setTimeout(()=>{p.classList.remove('turn-out');fn();p.classList.add('turn-in');setTimeout(()=>p.classList.remove('turn-in'),360);settle();},240);}
const warp=turn;
let typeTimer=null;
function say(txt){clearInterval(typeTimer);const el=document.getElementById('say');if(!el)return;if(RM){el.innerHTML=txt;return;}
 let i=0;const plain=txt;el.textContent='';el.classList.add('typing');typeTimer=setInterval(()=>{i+=2;el.textContent=plain.replace(/<[^>]+>/g,'').slice(0,i);if(i>=plain.length){clearInterval(typeTimer);el.classList.remove('typing');el.innerHTML=plain;}},16);}

/* ---------------- Explore: chapters not yet turned into stories ---------------- */
function paneVoyage(id,d){
 const f=findChapter(id), title=f.c.t;
 const notes=d.notes, N=notes.length, Q=d.quiz;
 const V={i:-1,cleared:0,words:new Set()};
 const route=()=>`<div class="route" aria-label="Page ${V.i+1} of ${N}">${notes.map((n,i)=>`<span class="node ${i<V.i?'past':i===V.i?'here':''}" title="${esc(n.h)}"><i></i></span>`).join('<b></b>')}</div>`;
 const comms=()=>`<div class="comms"><div class="ai" aria-hidden="true">${face('nanu')}</div><div class="say"><span class="nm">Nanu</span><p id="say" aria-live="polite"></p></div></div>`;
 const end=h=>/[?.!]$/.test(h)?h:h+'.';
 const LINES=[
  (n,h,k)=>`Page ${n}: ${end(h)} I covered ${k} important word${k===1?'':'s'} with yellow tape. Tap each one to peel it off!`,
  (n,h,k)=>`Next up: ${end(h)} There ${k===1?'is':'are'} ${k} hidden word${k===1?'':'s'} here. Can you find them all?`,
  (n,h,k)=>`Page ${n} is about ${end(h)} Peel off the ${k} yellow strip${k===1?'':'s'} as you read.`,
  (n,h,k)=>`Beep-boop! ${end(h)} ${k} secret word${k===1?'':'s'} to uncover on this page.`];

 const brief=()=>{clearInterval(typeTimer);
  $('#pane').innerHTML=`<div class="hud">${comms()}
   <div><div class="eyebrow">${esc(f.s.name)} · Chapter ${f.c.n}</div><h2 class="mt">${esc(title)}</h2></div>
   <ol class="sectors">${notes.map((n,i)=>`<li><span>${i+1}</span>${n.h}</li>`).join('')}</ol>
   <div class="row"><button class="btn red big" id="launch">Start reading</button><button class="btn ghost" id="readall">Read the full notes</button></div></div>`;
  say(`Hi, I'm Nanu! This chapter has ${N} short pages. On each page, peel off the yellow tape to find the important words, then answer one quick question.`);
  $('#launch').onclick=()=>turn(()=>sector(0));
  $('#readall').onclick=readAll;};

 const sector=i=>{V.i=i;const n=notes[i];let k=0;
  const body=n.b.replace(/<mark>(.*?)<\/mark>/g,(m,w)=>`<button class="sig" data-k="${k++}" data-w="${esc(w.replace(/<[^>]+>/g,''))}" aria-label="Hidden word">${w}</button>`);
  const total=k;let got=0;
  $('#pane').innerHTML=`${route()}<div class="hud" id="hud">${comms()}
   <div><div class="eyebrow">Page ${i+1} of ${N}</div><h2 class="mt">${n.h}</h2></div>
   <div class="log notes">${body}</div>
   <div class="hudbar"><span class="meter" id="sigc"></span><button class="btn" id="cp" disabled>Quick check</button>${total?'<button class="linkbtn" id="skip">Show all words</button>':''}</div>
   <div id="cpbox"></div></div>`;
  say(LINES[i%LINES.length](i+1,n.h.replace(/<[^>]+>/g,''),total));
  const upd=()=>{$('#sigc').innerHTML=total?`Hidden words found <b>${got} / ${total}</b>`:'No hidden words on this page';
   if(got===total){$('#cp').disabled=false;$('#cp').classList.add('ready');const s=$('#skip');if(s)s.remove();}};
  const peel=b=>{if(b.classList.contains('scanned'))return;b.classList.add('scanned');b.setAttribute('aria-label',b.dataset.w);V.words.add(b.dataset.w);got++;};
  $('#pane').querySelectorAll('.sig').forEach(b=>b.onclick=()=>{if(b.classList.contains('scanned'))return;peel(b);beep('scan');upd();if(got===total)say('You found them all! Now a quick question.');});
  const sk=$('#skip');if(sk)sk.onclick=()=>{$('#pane').querySelectorAll('.sig').forEach(peel);upd();};
  $('#cp').onclick=()=>checkpoint(i);upd();};

 const checkpoint=i=>{const qi=Math.min(Q.length-1,Math.floor(i*Q.length/N)),q=Q[qi];$('#cp').hidden=true;
  $('#cpbox').innerHTML=`<div class="checkpoint"><div class="eyebrow">Quick check</div><h3>${q[0]}</h3><div class="opts">${q[1].map((o,oi)=>`<button class="opt" data-o="${oi}">${o}</button>`).join('')}</div><div id="cpres"></div></div>`;
  $('#cpbox').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=+b.dataset.o,ok=o===q[2];
   $('#cpbox').querySelectorAll('.opt').forEach(x=>x.disabled=true);$('#cpbox').querySelector(`[data-o="${q[2]}"]`).classList.add('right');
   if(ok){V.cleared++;beep('ok');say('Correct! Well done.');}else{b.classList.add('wrong');beep('bad');const h=$('#hud');h.classList.remove('shake');void h.offsetWidth;h.classList.add('shake');say('Oops! Read why, then turn the page.');}
   const last=i===N-1;
   $('#cpres').innerHTML=`<p class="why">${ok?'<span class="ok">Correct!</span> ':'<span class="no">Not quite.</span> '}${q[3]}</p><button class="btn red big" id="go">${last?'Finish chapter':'Next page →'}</button>`;
   $('#go').onclick=()=>turn(()=>last?finish():sector(i+1));$('#go').focus({preventScroll:true});});
  $('#cpbox').scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'});};

 const finish=()=>{V.i=N;P.done[id]=true;save();
  $('#pane').innerHTML=`${route()}<div class="hud">${comms()}
   <div><div class="eyebrow">Chapter done</div><h2 class="mt">${V.cleared} of ${N} questions right</h2></div>
   <div class="readouts"><div class="ro"><span>Pages read</span><b>${N} / ${N}</b></div><div class="ro"><span>Questions right</span><b>${V.cleared} / ${N}</b></div><div class="ro"><span>Words found</span><b>${V.words.size}</b></div></div>
   ${V.words.size?`<div><div class="eyebrow" style="margin-bottom:8px">Words you collected</div><div class="chipset">${[...V.words].map(w=>`<span class="chip" style="cursor:default">${esc(w)}</span>`).join('')}</div></div>`:''}
   <div class="row"><button class="btn red big" id="final">Take the chapter test</button><button class="btn ghost" id="replay">Read again</button><button class="btn ghost" id="readall">Read the full notes</button></div></div>`;
  say(V.cleared===N?'Perfect! Every question right. Try the chapter test next.':`Nice work! ${N-V.cleared} question${N-V.cleared===1?'':'s'} to look at again. Then try the chapter test.`);
  $('#final').onclick=()=>$('#tab-quiz').click();$('#replay').onclick=brief;$('#readall').onclick=readAll;};

 const readAll=()=>{clearInterval(typeTimer);paneNotes(id,d);$('#pane').insertAdjacentHTML('afterbegin','<button class="btn ghost" id="backm" style="margin-bottom:16px">← Back to the pages</button>');$('#backm').onclick=brief;};
 brief();
}

 ph(el){
  const S=[['Gastric juice',1.2],['Lemon juice',2.2],['Vinegar',3],['Tomato juice',4.2],['Milk',6.5],['Pure water',7],['Blood',7.4],['Baking soda solution',8.5],['Milk of magnesia',10],['Sodium hydroxide solution',14]];

   el.innerHTML=`<h3>pH scale scanner</h3><p>Tap a substance to test it with universal indicator. Values are approximate.</p>
    <div class="chipset">${S.map((s,i)=>`<button class="chip ${i===k?'on':''}" data-k="${i}">${s[0]}</button>`).join('')}</div>
    <div class="svgbox"><svg viewBox="0 0 440 90" width="440" role="img" aria-label="pH scale">
     <defs><linearGradient id="phg">${Array.from({length:15},(_,i)=>`<stop offset="${i/14}" stop-color="${col(i)}"/>`).join('')}</linearGradient></defs>
     <rect x="20" y="30" width="400" height="22" rx="6" fill="url(#phg)"/>
     ${Array.from({length:15},(_,i)=>`<text x="${20+i*400/14}" y="70" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="JetBrains Mono, monospace">${i}</text>`).join('')}

    <p>${p<5.5?'Below 5.5: an acid this strong in the mouth would start tooth decay.':p<7?'Slightly acidic.':p===7?'Neither acidic nor basic.':'Basic: it can neutralise acids, like an antacid.'}</p>`;
   el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{k=+b.dataset.k;beep('scan');render();});};

 },
 mendel(el){
  const G=['TT','Tt','tt'];let a=0,b=2;
  const plant=(g,x)=>{const tall=g.includes('T');const h=tall?70:32;return `<g><path d="M${x} 100 V${100-h}" stroke="#3d9b4a" stroke-width="4"/><ellipse cx="${x-8}" cy="${100-h*0.55}" rx="8" ry="4" fill="#5cc06a"/><ellipse cx="${x+8}" cy="${100-h*0.3}" rx="8" ry="4" fill="#5cc06a"/><circle cx="${x}" cy="${96-h}" r="5" fill="#b98cff"/><text x="${x}" y="116" text-anchor="middle" font-size="12" fill="var(--ink)" font-family="JetBrains Mono, monospace">${g}</text></g>`;};
  const render=()=>{const p1=G[a],p2=G[b];const kids=[];for(const x of p1)for(const y of p2)kids.push([x,y].sort().join(''));
   const tall=kids.filter(k=>k.includes('T')).length;
   el.innerHTML=`<h3>Mendel's pea cross</h3><p>T = tall (dominant), t = short (recessive). Pick two parent plants.</p>
    <div class="row"><div class="ctrl"><label>Parent 1</label><div class="chipset">${G.map((g,i)=>`<button class="chip ${i===a?'on':''}" data-a="${i}">${g}</button>`).join('')}</div></div>
    <div class="ctrl"><label>Parent 2</label><div class="chipset">${G.map((g,i)=>`<button class="chip ${i===b?'on':''}" data-b="${i}">${g}</button>`).join('')}</div></div></div>
    <div class="tbl"><table><tr><th></th><th>${p2[0]}</th><th>${p2[1]}</th></tr><tr><th>${p1[0]}</th><td class="num">${kids[0]}</td><td class="num">${kids[1]}</td></tr><tr><th>${p1[1]}</th><td class="num">${kids[2]}</td><td class="num">${kids[3]}</td></tr></table></div>
    <div class="svgbox"><svg viewBox="0 0 320 122" width="320" role="img" aria-label="Offspring plants">${kids.map((k,i)=>plant(k,40+i*80)).join('')}</svg></div>
    <div class="readouts"><div class="ro"><span>Tall : short</span><b>${tall} : ${4-tall}</b></div><div class="ro"><span>Genotypes</span><b style="font-size:1rem">${[...new Set(kids)].map(g=>g+' ×'+kids.filter(k=>k===g).length).join(', ')}</b></div></div>
    <p>${p1==='TT'&&p2==='tt'||p1==='tt'&&p2==='TT'?'This is Mendel’s first cross: every F1 plant is tall (Tt). Now try Tt × Tt.':p1==='Tt'&&p2==='Tt'?'Mendel’s F2: tall and short in a 3 : 1 ratio. The short trait reappears.':'Tall shows whenever at least one T is present.'}</p>`;
   el.querySelectorAll('[data-a]').forEach(x=>x.onclick=()=>{a=+x.dataset.a;beep('tick');render();});
   el.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{b=+x.dataset.b;beep('tick');render();});};
  render();
 },
 lens(el){
  const f=10;
  el.innerHTML=`<h3>Convex lens bench</h3><p>Focal length 10 cm. Slide the object and watch where the image forms.</p>
   <div class="svgbox"><svg id="lsvg" viewBox="0 0 440 220" width="440" role="img" aria-label="Ray diagram"></svg></div>
   <div class="ctrl"><label for="lu">Object distance <output id="luo"></output></label><input type="range" id="lu" min="3" max="38" value="25" step="0.5"></div>

  const up=()=>{const d=+$('#lu').value;$('#luo').textContent=d+' cm';const s=5,cx=220,ay=110,ho=30;
   const ox=cx-d*s;let svg=`<line x1="0" y1="${ay}" x2="440" y2="${ay}" stroke="var(--line)"/>
    <path d="M${cx} 30 Q${cx+14} ${ay} ${cx} 190 Q${cx-14} ${ay} ${cx} 30Z" fill="rgba(94,231,255,.18)" stroke="var(--pen)" stroke-width="2"/>
    ${[[-2,'2F₁'],[-1,'F₁'],[1,'F₂'],[2,'2F₂']].map(([k,t])=>`<circle cx="${cx+k*f*s}" cy="${ay}" r="3" fill="var(--muted)"/><text x="${cx+k*f*s}" y="${ay+16}" text-anchor="middle" font-size="10" fill="var(--muted)">${t}</text>`).join('')}
    <path d="M${ox} ${ay} V${ay-ho}" stroke="var(--signal)" stroke-width="3"/><path d="M${ox-5} ${ay-ho+8} L${ox} ${ay-ho} L${ox+5} ${ay-ho+8}" stroke="var(--signal)" stroke-width="3" fill="none"/>`;
   let vtxt,mtxt,ntxt;
   if(Math.abs(d-f)<0.01){vtxt='∞';mtxt='∞';ntxt='At infinity';
    svg+=`<path d="M${ox} ${ay-ho} H${cx} L440 ${ay-ho+(440-cx)*ho/(f*s)}" stroke="var(--signal)" fill="none" opacity=".8"/><path d="M${ox} ${ay-ho} L440 ${ay-ho+(440-ox)*ho/(d*s)}" stroke="var(--signal)" fill="none" opacity=".8"/>`;}
   else{const v=f*d/(d-f),m=-v/d,hi=m*ho,ix=cx+v*s;
    vtxt=(v>0?'+':'')+v.toFixed(1)+' cm';mtxt=m.toFixed(2);
    const real=v>0;ntxt=(real?'Real, inverted':'Virtual, erect')+', '+(Math.abs(m)>1.02?'enlarged':Math.abs(m)<0.98?'diminished':'same size');
    const fx=cx+f*s;
    if(real){svg+=`<path d="M${ox} ${ay-ho} H${cx} L${ix} ${ay-hi}" stroke="var(--signal)" fill="none" opacity=".85"/><path d="M${ox} ${ay-ho} L${ix} ${ay-hi}" stroke="var(--signal)" fill="none" opacity=".85"/>
      <path d="M${ix} ${ay} V${ay-hi}" stroke="var(--pen)" stroke-width="3"/>`;}
    else{svg+=`<path d="M${ox} ${ay-ho} H${cx} L440 ${ay-ho+(440-cx)*ho/(f*s)}" stroke="var(--signal)" fill="none" opacity=".85"/><path d="M${ox} ${ay-ho} L440 ${ay-ho+(440-ox)*ho/(d*s)}" stroke="var(--signal)" fill="none" opacity=".85"/>
      <path d="M${cx} ${ay-ho} L${ix} ${ay-hi} M${ox} ${ay-ho} L${ix} ${ay-hi}" stroke="var(--muted)" stroke-dasharray="4 4" fill="none"/>
      <path d="M${ix} ${ay} V${ay-hi}" stroke="var(--pen)" stroke-width="3" stroke-dasharray="5 3"/>`;}
   }
   $('#lsvg').innerHTML=svg;$('#lv').textContent=vtxt;$('#lm').textContent=mtxt;$('#ln').textContent=ntxt;};
  $('#lu').oninput=up;up();
 },
 energy(el){
  const L=[['Grass','Producer'],['Grasshopper','Herbivore'],['Frog','Carnivore'],['Snake','Carnivore'],['Eagle','Top carnivore']];

  $('#en').oninput=up;up();
 }

const KIND={story:'Story',lab:'Experiment',game:'Game',zoom:'Zoom in',case:'Case file'};
function talk(box,lines,cb){const w=document.createElement('div');w.className='talk';box.appendChild(w);
 const btn=document.createElement('button');btn.className='btn ghost tapnext';btn.textContent='Tap to continue ▸';box.appendChild(btn);
 let k=0;const next=()=>{if(k>=lines.length)return;w.insertAdjacentHTML('beforeend',bubble(lines[k][0],lines[k][1]));beep('pop');k++;
  if(k>=lines.length){btn.remove();if(cb)cb();}
  const last=w.lastElementChild;if(k>1&&last)last.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'});};
 btn.onclick=next;next();return w;}
function ask(box,q,opts,right,why,cb){const w=document.createElement('div');w.className='checkpoint';
 w.innerHTML=`<div class="eyebrow">Quick question</div><h3>${q}</h3><div class="choices">${opts.map((o,i)=>`<button class="choice" data-i="${i}">${o}</button>`).join('')}</div><div class="why" hidden></div>`;box.appendChild(w);
 w.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,y=w.querySelector('.why');y.hidden=false;
  if(i===right){w.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add('right');beep('ok');y.innerHTML='<span class="ok">Correct!</span> '+why;if(cb)cb();}
  else{b.classList.add('wrong');b.disabled=true;beep('bad');b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');y.innerHTML='<span class="no">Not quite.</span> Try another answer.';}});
 w.scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'});return w;}
function starFly(){beep('ok');wait(140,()=>beep('win'));const t=document.getElementById('epStars');if(!t||RM)return;const r=t.getBoundingClientRect();
 const s=document.createElement('div');s.className='starpop';s.innerHTML=STAR;const x=innerWidth/2-30,y=innerHeight/2-30;s.style.left=x+'px';s.style.top=y+'px';
 s.style.setProperty('--dx',(r.left+r.width/2-x-30)+'px');s.style.setProperty('--dy',(r.top+r.height/2-y-30)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),950);}
function confetti(){if(RM)return;const cols=['#e3242b','#ffcc29','#ff8a1e','#2563d9','#1e9e57'];
 for(let i=0;i<60;i++){const e=document.createElement('i');e.className='confetti';e.style.left=Math.random()*100+'vw';e.style.top=(-20-Math.random()*80)+'px';e.style.background=cols[i%5];
  e.style.setProperty('--x',(Math.random()*160-80)+'px');e.style.setProperty('--r',(Math.random()*720-360)+'deg');e.style.animationDelay=Math.random()*.5+'s';e.style.animationDuration=(1.3+Math.random())+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),3200);}}

 const fs=a=>a.label.length>3?13:a.r>20?20:14;
 w.innerHTML=`<svg viewBox="0 0 640 215" role="img" aria-label="${spec.aria}"><rect width="640" height="215" fill="#f4efff"/>
  ${T_(22,30,14,'ZOOM ×100,000,000',{a:'start',f:'#8b4fd6'})}<g class="bonds"></g>
  ${spec.atoms.map(a=>`<g data-a="${a.id}" transform="translate(${a.from[0]} ${a.from[1]})"><circle r="${a.r}" fill="${a.fill}" stroke="${INK}" stroke-width="3"/><text y="${fs(a)*.36}" text-anchor="middle" font-family="Baloo 2, sans-serif" font-weight="800" font-size="${fs(a)}" fill="${a.tc||INK}">${a.label}</text></g>`).join('')}
  <text class="cap" x="320" y="200" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="18" font-weight="600" fill="${INK}">${spec.before}</text></svg>`;
 box.appendChild(w);const svg=w.querySelector('svg');
 const pos={};spec.atoms.forEach(a=>pos[a.id]=a.from.slice());
 const bonds=list=>{svg.querySelector('.bonds').innerHTML=(list||[]).map(([p,q])=>`<line x1="${pos[p][0]}" y1="${pos[p][1]}" x2="${pos[q][0]}" y2="${pos[q][1]}" stroke="${INK}" stroke-width="7" stroke-linecap="round"/>`).join('');};
 bonds(spec.bondsBefore);
 return {play(cb){svg.querySelector('.bonds').innerHTML='';beep('scan');
  tween(1700,k=>{spec.atoms.forEach(a=>{const x=a.from[0]+(a.to[0]-a.from[0])*k,y=a.from[1]+(a.to[1]-a.from[1])*k-Math.sin(k*Math.PI)*(a.arc||0);pos[a.id]=[x,y];svg.querySelector(`[data-a="${a.id}"]`).setAttribute('transform',`translate(${x} ${y})`);});},
   ()=>{spec.atoms.forEach(a=>pos[a.id]=a.to.slice());bonds(spec.bondsAfter);svg.querySelector('.cap').textContent=spec.after;beep('ok');if(cb)cb();});}};}

function paneStory(id,d){
 const E=d.story,N=E.pages.length;
 P.ep=P.ep||{};const S=P.ep[id]||(P.ep[id]={i:0,stars:[]});if(!(S.i>=0&&S.i<=N))S.i=0;
 const count=()=>E.pages.filter((p,k)=>S.stars[k]).length;
 const show=i=>{S.i=i;save();if(i>=N)finish();else render(i);};
 const render=i=>{const pg=E.pages[i];
  $('#pane').innerHTML=`<div class="ep">
   <div class="ep-top"><div class="ep-prog">${E.pages.map((p,k)=>`<button class="seg-dot ${k<i?'done':k===i?'here':''}" data-k="${k}" aria-label="Page ${k+1}: ${esc(p.title)}${S.stars[k]?', star earned':''}"></button>`).join('')}</div>
    <div class="ep-stars" id="epStars">${STAR}<span>${count()} / ${N}</span></div></div>
   <article class="ep-page"><header class="ep-head"><span class="kind k-${pg.kind}">${KIND[pg.kind]}</span><h2>${pg.title}</h2><span class="ep-pageno">Page ${i+1} of ${N}</span></header>
    <div class="ep-body" id="epBody"></div></article>
   <div class="ep-nav"><button class="btn ghost" id="epBack" ${i===0?'disabled':''}>← Back</button><span class="hint" id="epHint">${S.stars[i]?'You earned the star on this page.':'Finish the activity to earn a star.'}</span><button class="btn${S.stars[i]?' red':''}" id="epNext">${i===N-1?'Finish episode':'Next page →'}</button></div></div>`;
  const body=$('#epBody');
  const api={body,
   win(){if(!S.stars[i]){S.stars[i]=1;save();starFly();}const sp=$('#epStars span');if(sp)sp.textContent=`${count()} / ${N}`;
    const h=$('#epHint');if(h)h.textContent='Star earned! Turn the page when you are ready.';const nx=$('#epNext');if(nx)nx.classList.add('red','ready');
    if(pg.key&&!body.querySelector('.keynote')){body.insertAdjacentHTML('beforeend',`<div class="keynote"><span class="lbl">Remember</span>${pg.key}</div>`);}},
   talk:(lines,cb,box)=>talk(box||body,lines,cb),
   ask:(q,opts,right,why,cb,box)=>ask(box||body,q,opts,right,why,cb),
   nanu:(t,box)=>{(box||body).insertAdjacentHTML('beforeend',`<div class="talk">${bubble('nanu',t)}</div>`);}};
  pg.run(api);
  $('#epBack').onclick=()=>turn(()=>show(i-1));
  $('#epNext').onclick=()=>turn(()=>show(i+1));
  $('#pane').querySelectorAll('.seg-dot').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(k!==i)turn(()=>show(k));});};
 const finish=()=>{const n=count();P.done[id]=true;save();
  $('#pane').innerHTML=`<div class="ep"><article class="ep-page"><header class="ep-head"><span class="kind k-story">The end</span><h2>Episode ${E.no} complete!</h2></header>
   <div class="ep-body"><div class="badge">${badgeSvg()}<h3>${E.badge}</h3><p style="margin:0">You collected <b>${n} of ${N}</b> stars.${n<N?' Go back to any page to win the missing stars.':''}</p></div>
   <div class="talk">${E.outro.map(l=>bubble(l[0],l[1])).join('')}</div>
   <div class="keynote"><span class="lbl">Your notebook: everything you learned</span><ul>${E.pages.filter(p=>p.key).map(p=>`<li>${p.key}</li>`).join('')}</ul></div>
   <div class="actions"><button class="btn red big" id="goTest">Take the chapter test</button><button class="btn ghost" id="goRev">Revise the notes</button><button class="btn ghost" id="replay">Read the story again</button></div></div></article></div>`;
  confetti();beep('win');
  $('#goTest').onclick=()=>$('#tab-quiz').click();$('#goRev').onclick=()=>$('#tab-notes').click();$('#replay').onclick=()=>turn(()=>show(0));};
 show(S.i);
}

/* ---------------- Episode 1: The Great Diwali Clean-up ---------------- */
C['sci-1'].widget=null;
C['sci-1'].story={no:1,title:'The Great Diwali Clean-up',badge:'Reaction Detective',
 outro:[['dadi','The walls shine, the gate is painted and my payal sparkles again. Happy Diwali, my little scientists!'],['kabir','And now I finally get my laddoos. Digesting them is a chemical reaction too, right, Nanu?'],['nanu','Correct! Beep-boop. Next time: acids, bases and the mystery of the turmeric stain!']],
 pages:[
 {kind:'story',title:'Three days to Diwali',
  key:'In a <b>chemical reaction</b>, substances change into <b>new substances</b> with new properties.',
  run(a){a.body.insertAdjacentHTML('beforeend',`<div class="panel">${sceneHouse()}</div>`);
   a.talk([['dadi','Three days to Diwali! The walls need whitewash, my silver payal has turned black, and just look at that rusty gate!'],
    ['kabir','Cleaning? On a holiday? Dadi, I only came for the laddoos.'],
    ['tara','Wait. Why does silver turn black at all? Nobody painted it.'],
    ['nanu','Beep-boop! Silver slowly reacts with gases in the air. That is a <b>chemical reaction</b>, and this house is full of them.'],
    ['tara','Full of them? Show us, Nanu!'],
    ['nanu','Hold on tight. Science goggles on. Let the Diwali clean-up begin!']],()=>a.win());}},

 {kind:'game',title:'Spot the reactions',
  key:'Clues that a chemical reaction has happened: a <b>change in state</b>, a <b>change in colour</b>, a <b>gas given off</b>, or a <b>change in temperature</b>.',
  run(a){a.nanu('Dadi’s kitchen has <b>4 chemical reactions</b> going on. Tap them! Careful: the other 3 are only physical changes.');
   a.body.insertAdjacentHTML('beforeend',`<div class="stage">${sceneKitchen()}</div><div class="obs" id="spSay" aria-live="polite">Tap an object to check it.</div><div class="mini" id="spCount">Reactions found: 0 of 4</div>`);
   const found=new Set();
   a.body.querySelectorAll('.hot').forEach(g=>{const it=SPOT.find(s=>s.k===g.dataset.k);
    const act=()=>{const sy=a.body.querySelector('#spSay');
     if(it.yes){if(!found.has(it.k)){found.add(it.k);g.classList.add('found');beep('ok');}sy.innerHTML=`<b class="ok">Chemical reaction!</b> ${it.say}`;}
     else{g.classList.add('phys');g.classList.remove('nope');void g.getBBox();g.classList.add('nope');beep('bad');sy.innerHTML=`<b class="no">Only a physical change.</b> ${it.say}`;}
     a.body.querySelector('#spCount').textContent=`Reactions found: ${found.size} of 4`;if(found.size===4)a.win();};
    g.onclick=act;g.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();act();}};});}},

 {kind:'lab',title:'The dazzling ribbon',
  key:'Magnesium + oxygen → magnesium oxide, written as <b>2Mg + O₂ → 2MgO</b>. The substances you start with are <b>reactants</b>; the new ones are <b>products</b>.',
  run(a){a.nanu('Kabir’s first experiment: clean a magnesium ribbon, then burn it. <b>Safety first:</b> in a real lab, do this only with your teacher, and keep the ribbon far from your eyes.');
   a.body.insertAdjacentHTML('beforeend',`<div class="stage">${mgStage()}</div><div class="actions"><button class="btn" id="mg1">1. Rub it with sandpaper</button><button class="btn" id="mg2" disabled>2. Hold it in the flame</button></div><div id="mgOut"></div>`);
   const S=k=>a.body.querySelector('#'+k);
   S('mg1').onclick=()=>{S('mg1').disabled=true;noise(.8,.03);const sand=S('mgSand');
    tween(1400,k=>{let x,y;if(k<.2){const t=k/.2;x=-140*t;y=-64*t;}else if(k<.8){const t=(k-.2)/.6;x=-140+26*Math.sin(t*Math.PI*8);y=-64;}else{const t=(k-.8)/.2;x=-140*(1-t);y=-64*(1-t);}sand.setAttribute('transform',`translate(${x} ${y})`);},
     ()=>{sand.removeAttribute('transform');S('mgRib').setAttribute('stroke','#d7dbe1');S('mgGlint').setAttribute('opacity','1');S('mgOut').innerHTML='<div class="obs">Shiny now! Rubbing removed the dull layer on the ribbon, so fresh magnesium can react.</div>';S('mg2').disabled=false;});};
   S('mg2').onclick=()=>{S('mg2').disabled=true;const dark=S('mgDark'),glow=S('mgGlow'),warn=S('mgWarn'),rib=S('mgRib');noise(1.8,.05);beep('flash');S('mgOut').innerHTML='';
    tween(350,k=>{dark.setAttribute('opacity',.8*k);glow.setAttribute('opacity',k);warn.setAttribute('opacity',k);},()=>{glow.classList.add('flicker');
     wait(2200,()=>{glow.classList.remove('flicker');tween(700,k=>{dark.setAttribute('opacity',.8*(1-k));glow.setAttribute('opacity',1-k);warn.setAttribute('opacity',1-k);rib.setAttribute('opacity',1-k);S('mgAsh').setAttribute('opacity',k);S('mgAshT').setAttribute('opacity',k);},()=>{
      a.ask('It burned with a dazzling white flame and left a white powder. What is the powder?',['Soot from the flame','Magnesium oxide','Melted magnesium','Sand from the sandpaper'],1,'Magnesium joined with oxygen from the air to make magnesium oxide, a brand-new substance.',()=>{
       const z=document.createElement('div');z.className='actions';z.innerHTML='<button class="btn red">Zoom in with Nanu</button>';a.body.appendChild(z);
       z.firstChild.onclick=e=>{e.target.disabled=true;const st=atomStage(a.body,{aria:'Two magnesium atoms each joining one oxygen atom',before:'2Mg + O₂',after:'2Mg + O₂ → 2MgO',
        atoms:[{id:'m1',label:'Mg',fill:'#b8bdc4',r:28,from:[90,100],to:[200,100]},{id:'m2',label:'Mg',fill:'#b8bdc4',r:28,from:[200,100],to:[390,100]},{id:'o1',label:'O',fill:'#e3242b',tc:'#fff',r:19,from:[440,100],to:[246,100],arc:55},{id:'o2',label:'O',fill:'#e3242b',tc:'#fff',r:19,from:[478,100],to:[436,100],arc:30}],
        bondsBefore:[['o1','o2']],bondsAfter:[['m1','o1'],['m2','o2']]});
        wait(300,()=>st.play(()=>{a.nanu('See? The atoms only changed partners. Two magnesium atoms each grabbed one oxygen atom. No atom vanished, and none appeared from nowhere.');a.win();}));};});});});});};}},

 {kind:'game',title:'Balance the taraazu',
  key:'Atoms are never created or destroyed, so both sides of an equation must have the same number of each kind of atom: the <b>law of conservation of mass</b>. Change only the big numbers in front, never the small ones inside a formula. States: (s) solid, (l) liquid, (g) gas, (aq) dissolved in water.',
  run(a){a.talk([['kabir','I wrote it down: Mg + O₂ → MgO. Done!'],['tara','Hmm. Two oxygen atoms go in, but only one comes out. Where did the other one go?'],['nanu','Let’s weigh it on Dadi’s taraazu. If the atoms match on both sides, the pans balance. Use + and − to change how many of each molecule there are.']],()=>{
   const EQ=[{n:'Magnesium burns',r:[['Mg',{Mg:1}],['O2',{O:2}]],p:[['MgO',{Mg:1,O:1}]]},{n:'Water forms',r:[['H2',{H:2}],['O2',{O:2}]],p:[['H2O',{H:2,O:1}]]},
    {n:'Iron and steam',r:[['Fe',{Fe:1}],['H2O',{H:2,O:1}]],p:[['Fe3O4',{Fe:3,O:4}],['H2',{H:2}]]},{n:'Natural gas burns',r:[['CH4',{C:1,H:4}],['O2',{O:2}]],p:[['CO2',{C:1,O:2}],['H2O',{H:2,O:1}]]}];
   let q=0,co=null,ang=0,won=false;const w=document.createElement('div');w.className='scalebox';a.body.appendChild(w);
   const render=()=>{const e=EQ[q];if(!co)co=[...e.r,...e.p].map(()=>1);const all=[...e.r,...e.p],els=[...new Set(all.flatMap(x=>Object.keys(x[1])))];
    const cnt=(side,off)=>{const m={};side.forEach((x,i)=>Object.entries(x[1]).forEach(([el,n])=>m[el]=(m[el]||0)+n*co[off+i]));return m;};
    const L=cnt(e.r,0),R=cnt(e.p,e.r.length),ok=els.every(el=>L[el]===R[el]);
    const mL=els.reduce((s,el)=>s+(L[el]||0)*TZ_MASS[el],0),mR=els.reduce((s,el)=>s+(R[el]||0)*TZ_MASS[el],0);
    let target=ok?0:Math.max(-.26,Math.min(.26,(mL-mR)/Math.max(mL,mR)*.7));if(!ok&&Math.abs(target)<.05)target=.05*Math.sign((mL-mR)||1);
    const term=(x,i)=>`<span class="step"><button aria-label="Fewer ${x[0]}" data-i="${i}" data-d="-1">−</button><b>${co[i]}</b><button aria-label="More ${x[0]}" data-i="${i}" data-d="1">+</button></span><span class="formula">${sub(x[0])}</span>`;
    w.innerHTML=`<div class="chipset">${EQ.map((x,i)=>`<button class="chip ${i===q?'on':''}" data-q="${i}">${x.n}</button>`).join('')}</div>
     <div class="stage"><svg class="tz" viewBox="0 0 640 330" role="img" aria-label="Balance scale with reactant atoms on the left and product atoms on the right"></svg></div>
     <div class="eqline">${e.r.map((x,i)=>term(x,i)).join(' + ')} → ${e.p.map((x,i)=>term(x,e.r.length+i)).join(' + ')}</div>
     <div class="chipset">${els.map(el=>`<span class="chip" style="cursor:default;background:${L[el]===R[el]?'var(--good-soft)':'var(--bad-soft)'}">${el}: ${L[el]||0} left, ${R[el]||0} right ${L[el]===R[el]?'✓':'✗'}</span>`).join('')}</div>
     <div class="obs">${ok?'<b class="ok">Balanced!</b> The same atoms are on both pans, so the mass is the same.':'Not balanced yet. Which atom is missing on one side?'}</div>`;
    const svg=w.querySelector('.tz'),from=ang;drawScale(svg,ang,L,R,els);tween(450,k=>{ang=from+(target-from)*k;drawScale(svg,ang,L,R,els);});
    w.querySelectorAll('.step button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;co[i]=Math.min(9,Math.max(1,co[i]+ +b.dataset.d));beep('tick');render();});
    w.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{q=+b.dataset.q;co=null;render();});
    if(ok){beep('ok');if(!won){won=true;a.win();}}};
   render();});}},

 {kind:'lab',title:'Dadi’s whitewash',
  key:'<b>Combination reaction:</b> two or more substances join to form one. CaO + H₂O → Ca(OH)₂ + heat. A reaction that gives out heat is <b>exothermic</b>, like respiration, burning natural gas, and vegetable waste turning into compost.',
  run(a){a.talk([['dadi','Time to make the whitewash. Kabir, pour the water on the chuna slowly, and don’t touch it.'],['kabir','It’s just white powder, Dadi. What could happen?']],()=>{
   a.body.insertAdjacentHTML('beforeend',`<div class="stage">${chunaStage()}</div><div class="actions"><button class="btn" id="ch1">Pour the water</button><button class="btn" id="ch2" disabled>Paint the wall</button></div><div id="chOut" style="display:grid;gap:12px"></div>`);
   const S=k=>a.body.querySelector('#'+k);
   S('ch1').onclick=()=>{S('ch1').disabled=true;const st=S('chStream');noise(1.8,.04);
    tween(700,k=>st.setAttribute('stroke-dasharray',`${k*260} 400`),()=>{S('chBubs').setAttribute('opacity',1);
     tween(1600,k=>{S('chMilk').setAttribute('opacity',k);S('chLumps').setAttribute('opacity',1-k);S('chThermo').setAttribute('y',230-110*k);S('chThermo').setAttribute('height',20+110*k);S('chHiss').setAttribute('opacity',Math.min(1,k*2));S('chSteam').setAttribute('opacity',k);S('chHot').setAttribute('opacity',k);},()=>{st.setAttribute('opacity','0');
      talk(S('chOut'),[['kabir','AAH! It’s hissing, and the bucket is HOT!'],['nanu','Quicklime (calcium oxide) is joining with water to make slaked lime. Two substances become one: a <b>combination reaction</b>. It gives out heat, so it is <b>exothermic</b>. Never touch it: it can burn your skin.']],()=>{S('chOut').insertAdjacentHTML('beforeend','<div class="eq">CaO(s) + H₂O(l) → Ca(OH)₂(aq) + heat</div>');S('ch2').disabled=false;});});});};
   S('ch2').onclick=()=>{S('ch2').disabled=true;const p=S('chPaint');noise(1.2,.02);tween(1400,k=>p.setAttribute('width',287*k),()=>{const box=S('chOut');
    box.insertAdjacentHTML('beforeend','<div class="ctrl"><label for="chDay">Days after painting: <output id="chDayO">0</output> (slide to wait)</label><input type="range" id="chDay" min="0" max="3" step="1" value="0"></div>');
    const r=box.querySelector('#chDay');let said=false;
    r.oninput=()=>{const dd=+r.value;box.querySelector('#chDayO').textContent=dd;S('chDayT').textContent='Day '+dd;S('chSheen').setAttribute('opacity',[0,.25,.65,1][dd]);S('chSpark').setAttribute('opacity',dd>=2?1:0);
     if(dd===3&&!said){said=true;beep('ok');talk(box,[['tara','Look, the wall is shiny now!'],['nanu','The slaked lime slowly reacts with carbon dioxide in the air. After two or three days it makes a thin, shiny layer of calcium carbonate. Another combination reaction!']],()=>{
      box.insertAdjacentHTML('beforeend','<div class="eq">Ca(OH)₂(aq) + CO₂(g) → CaCO₃(s) + H₂O(l)</div>');
      ask(box,'Your body is running an exothermic reaction right now. Which one?',['Melting of ice','Respiration','Dissolving salt in water','Evaporation of sweat'],1,'Respiration breaks down glucose using oxygen and releases energy. That energy keeps you warm and alive.',()=>a.win());});}};});};});}},

 {kind:'lab',title:'Break it apart',
  key:'<b>Decomposition reaction:</b> one substance breaks into two or more simpler ones. It needs energy from <b>heat</b>, <b>electricity</b> or <b>light</b>, so most decomposition reactions are <b>endothermic</b>.',
  run(a){a.nanu('Where does Dadi’s chuna come from? From breaking another substance apart! Try three ways of breaking things: heat, electricity and light.');
   a.body.insertAdjacentHTML('beforeend',`<div class="chipset" id="dcTabs">${DC.map((x,i)=>`<button class="chip ${i===0?'on':''}" data-t="${i}">${i+1}. ${x.name}</button>`).join('')}</div><div class="stage" id="dcStage"></div><div class="actions" id="dcAct"></div><div id="dcOut" style="display:grid;gap:10px"></div><div id="dcQ"></div>`);
   const done=[0,0,0],S=k=>a.body.querySelector('#'+k);
   const show=i=>{a.body.querySelectorAll('#dcTabs .chip').forEach(c=>c.classList.toggle('on',+c.dataset.t===i));const L=DC[i];
    S('dcStage').innerHTML=L.svg();S('dcOut').innerHTML=done[i]?L.result:'';if(done[i])L.apply(S,1);
    S('dcAct').innerHTML=`<button class="btn" id="dcGo" ${done[i]?'disabled':''}>${done[i]?'Done ✓':L.btn}</button>`;
    S('dcGo').onclick=e=>{e.target.disabled=true;if(i===0)noise(1.2,.015);tween(L.dur,k=>L.apply(S,k),()=>{done[i]=1;L.apply(S,1);S('dcOut').innerHTML=L.result;e.target.textContent='Done ✓';beep('ok');
     const nx=done.indexOf(0);
     if(nx>=0){S('dcAct').insertAdjacentHTML('beforeend',`<button class="btn ghost" id="dcNext">Next: ${DC[nx].name} →</button>`);S('dcNext').onclick=()=>show(nx);}
     else if(!S('dcQ').innerHTML)ask(S('dcQ'),'In all three, energy was put in to break one substance apart. Reactions that take in energy are…',['Exothermic','Endothermic','Combination reactions','Displacement reactions'],1,'They absorb energy as heat, electricity or light, so they are endothermic.',()=>a.win());});};};
   a.body.querySelectorAll('#dcTabs .chip').forEach(c=>c.onclick=()=>show(+c.dataset.t));show(0);}},

 {kind:'lab',title:'The nail that turned brown',
  key:'<b>Displacement reaction:</b> a more reactive element pushes a less reactive one out of its compound. Fe + CuSO₄ → FeSO₄ + Cu. Zinc and lead can push copper out too.',
  run(a){a.talk([['tara','Kabir, why is your iron nail hanging in that blue liquid?'],['kabir','Science fair! It’s copper sulphate solution. I kept a second nail aside to compare. Now we wait 20 minutes.'],['nanu','Waiting is boring. Use my time slider!']],()=>{
   a.body.insertAdjacentHTML('beforeend',`<div class="stage">${nailStage()}</div><div class="ctrl"><label for="nlT">Minutes in the solution: <output id="nlO">0</output></label><input type="range" id="nlT" min="0" max="20" step="1" value="0"></div><div id="nlOut" style="display:grid;gap:12px"></div>`);
   const S=k=>a.body.querySelector('#'+k);let shown=false;
   S('nlT').oninput=()=>{const m=+S('nlT').value,k=m/20;S('nlO').textContent=m;S('nSol').setAttribute('fill',mixc('#2b7bd6','#b9dcb0',k));S('nNail').setAttribute('stroke',mixc('#868b92','#b0582a',k));S('nClock').textContent=m+' min';S('nHand').setAttribute('transform',`rotate(${m*18} 560 62)`);
    if(m===20&&!shown){shown=true;beep('ok');const out=S('nlOut');out.innerHTML='<div class="obs">After 20 minutes: the nail in the solution has a brownish coat and the blue colour has faded. The nail kept aside has not changed.</div>';
     talk(out,[['nanu','Iron is more reactive than copper, so iron pushes copper out of copper sulphate. That brown coat on the nail is copper metal!']],()=>{
      const z=document.createElement('div');z.className='actions';z.innerHTML='<button class="btn red">Zoom in with Nanu</button>';out.appendChild(z);
      z.firstChild.onclick=e=>{e.target.disabled=true;const st=atomStage(out,{aria:'An iron atom taking the place of a copper atom',before:'Fe + CuSO₄',after:'Fe + CuSO₄ → FeSO₄ + Cu',
       atoms:[{id:'fe',label:'Fe',fill:'#9a9fa6',r:26,from:[90,100],to:[332,100]},{id:'cu',label:'Cu',fill:'#c46a2e',tc:'#fff',r:26,from:[332,100],to:[560,120],arc:60},{id:'so',label:'SO₄',fill:'#ffd34d',r:32,from:[392,100],to:[392,100]}],
       bondsBefore:[['cu','so']],bondsAfter:[['fe','so']]});
       wait(300,()=>st.play(()=>ask(out,'Zinc is more reactive than copper. What happens if you dip zinc in copper sulphate solution?',['Nothing happens','Zinc pushes copper out','Copper pushes zinc out','The zinc turns blue'],1,'Zn + CuSO₄ → ZnSO₄ + Cu. The more reactive metal always wins.',()=>a.win())));};});}};});}},

 {kind:'lab',title:'Swap partners!',
  key:'<b>Double displacement reaction:</b> two compounds swap partners. Na₂SO₄ + BaCl₂ → BaSO₄ + 2NaCl. The insoluble solid that forms is called a <b>precipitate</b>.',
  run(a){a.nanu('Two clear, colourless solutions. Mix them and watch closely!');
   a.body.insertAdjacentHTML('beforeend',`<div class="stage">${ppStage()}</div><div class="actions"><button class="btn" id="pp1">Mix the two solutions</button></div><div id="ppOut" style="display:grid;gap:12px"></div>`);
   const S=k=>a.body.querySelector('#'+k);
   S('pp1').onclick=()=>{S('pp1').disabled=true;ppPour(S,'#ffffff','A white solid!',()=>{const out=S('ppOut');
    talk(out,[['kabir','Whoa! Where did that white stuff come from? Both liquids were clear!'],['nanu','The compounds swapped partners. Barium and sulphate got together to make barium sulphate, which does not dissolve in water. So it appears as a white solid.']],()=>{
     const st=atomStage(out,{aria:'Ions swapping partners',before:'Na₂SO₄ + BaCl₂',after:'BaSO₄ + 2NaCl',
      atoms:[{id:'n1',label:'Na',fill:'#c9b6f2',r:22,from:[70,64],to:[96,58]},{id:'n2',label:'Na',fill:'#c9b6f2',r:22,from:[70,140],to:[470,58]},{id:'so',label:'SO₄',fill:'#ffd34d',r:30,from:[146,102],to:[352,150]},
       {id:'ba',label:'Ba',fill:'#9ad0a7',r:26,from:[490,102],to:[292,150]},{id:'c1',label:'Cl',fill:'#86c5ff',r:20,from:[570,64],to:[140,58]},{id:'c2',label:'Cl',fill:'#86c5ff',r:20,from:[570,140],to:[514,58]}],
      bondsBefore:[['n1','so'],['n2','so'],['ba','c1'],['ba','c2']],bondsAfter:[['n1','c1'],['n2','c2'],['ba','so']]});
     const z=document.createElement('div');z.className='actions';z.innerHTML='<button class="btn red">Watch the partners swap</button>';out.appendChild(z);
     z.firstChild.onclick=e=>{e.target.disabled=true;st.play(()=>{const b=document.createElement('div');b.className='actions';b.innerHTML='<button class="btn">Try another pair: lead nitrate + potassium iodide</button>';out.appendChild(b);
      b.firstChild.onclick=e2=>{e2.target.disabled=true;S('tA').textContent='Lead nitrate';S('tB').textContent='Potassium iodide';
       ppPour(S,'#ffd21f','A yellow solid!',()=>{out.insertAdjacentHTML('beforeend','<div class="obs">This time the solid is bright yellow: lead iodide.</div><div class="eq">Pb(NO₃)₂(aq) + 2KI(aq) → PbI₂(s) + 2KNO₃(aq)</div>');
        ask(out,'An insoluble solid that forms when two solutions react is called a…',['Solution','Precipitate','Crystal of salt','Bubble'],1,'A precipitate. Both white barium sulphate and yellow lead iodide are precipitates.',()=>a.win());});};});};});});};}},

 {kind:'zoom',title:'Gaining and losing oxygen',
  key:'<b>Oxidation:</b> a substance gains oxygen (or loses hydrogen). <b>Reduction:</b> a substance loses oxygen (or gains hydrogen). When both happen in one reaction, it is a <b>redox</b> reaction.',
  run(a){a.nanu('Heat brown copper powder in a china dish and watch its colour. Then we’ll undo it!');
   a.body.insertAdjacentHTML('beforeend',`<div class="stage">${rdStage()}</div><div class="actions"><button class="btn" id="rd1">1. Heat it in air</button><button class="btn" id="rd2" disabled>2. Pass hydrogen over it</button></div><div id="rdOut" style="display:grid;gap:12px"></div>`);

  const sp=i=>SP[i];const aqs=ids.filter(i=>sp(i).st==='aq'),acids=aqs.filter(i=>sp(i).kind==='acid'),metals=ids.filter(i=>sp(i).kind==='metal');const add=o=>out.push(o);
  if(has('Na')&&wet)add({k:'Na_w',rate:0.12,R:{Na:1},Pd:{[aq('Na','OH')]:1},gas:{H2:1},heat:45,disc:'Na_water',eq:'2Na + 2H₂O → 2NaOH + H₂',tags:'Metal + water · Exothermic',fl:{gas:1,hot:1,colour:'any'},fx:'naflame'});

   if(has('CuSO4a'))add({k:'rehyd',rate:0.06,R:{CuSO4a:1},Pd:{[aq('Cu','SO4')]:1},heat:25,disc:'rehyd_CuSO4',eq:'CuSO₄ + 5H₂O → CuSO₄·5H₂O',tags:'Water of crystallisation · Exothermic',fl:{colour:1,hot:'any'}});}

 function step(dt){const vol=liq(),wet=vol>0.05;
  if(S.heat){S.used=1;const tgt=wet?100:420,r=wet?1.6:8;S.temp+=Math.sign(tgt-S.temp)*Math.min(Math.abs(tgt-S.temp),r*dt);}

  const gr={},fired=new Set(),src=[];
  processes(vol,wet).forEach(p=>{
   if(p.none){S.nt[p.k]=(S.nt[p.k]||0)+dt;if(S.nt[p.k]>=p.need&&!S.seen[p.k]){S.seen[p.k]=1;noneHappened(p);}return;}
   let xi=p.rate*dt;for(const id in p.R)xi=Math.min(xi,(S.amt[id]||0)/p.R[id]);if(!(xi>1e-7))return;
   for(const id in p.R)S.amt[id]-=p.R[id]*xi;for(const id in (p.Pd||{}))S.amt[id]=(S.amt[id]||0)+p.Pd[id]*xi;
   if(p.gas)for(const g in p.gas){const v=p.gas[g]*xi;gr[g]=(gr[g]||0)+v/dt;S.near[g]=(S.near[g]||0)+v;if(g!=='H2Ov')S.gasTot+=v;if(p.elec){if(p.elec.cat===g)S.cath+=v;if(p.elec.an===g)S.anod+=v;}
    if(g!=='H2Ov')src.push([p.elec?(p.elec.cat===g?165:195):p.src&&SP[p.src]&&SP[p.src].kind==='metal'?180:180,p.elec?300:350,v/dt,!!p.elec]);}
   if(p.heat)S.temp+=p.heat*xi/(1+vol);
   if(p.milk)S.milk=Math.min(1,S.milk+xi);if(p.ppt){S.cloud=1;S.cloudCol=SP[p.ppt].col;}
   if(p.gas&&p.gas.H2Ov)S.dropT=40;
   if(p.race){PL.race[p.race]=Math.max(PL.race[p.race]||0,xi/dt);}
   S.live[p.k]=xi/dt;fired.add(p.k);onFire(p,xi);});
  for(const k in S.live)if(!fired.has(k)){S.live[k]*=0.5;if(S.live[k]<1e-6)delete S.live[k];}
  const allG=new Set([...Object.keys(S.gr),...Object.keys(gr)]);allG.forEach(g=>{S.gr[g]=(S.gr[g]||0)+((gr[g]||0)-(S.gr[g]||0))*Math.min(1,dt*0.8);});

  if(S.blowT>0){S.blowT-=dt;src.push([206,330,0.03,false]);}
  S.src=src;
  S.cloud*=Math.exp(-dt/40);if(S.dropT>0)S.dropT-=dt;
  for(const id in S.amt)if(S.amt[id]<1e-6)delete S.amt[id];
  S.time+=dt;
  if(S.time-S.lastHist>=2){S.lastHist=S.time;S.hist.push([S.time/60,S.temp,S.gasTot*25,S.cath*25,S.anod*25]);if(S.hist.length>900)S.hist.splice(0,S.hist.length-900);}
  const cu=Object.keys(S.amt).filter(i=>SP[i]&&SP[i].st==='aq'&&SP[i].cat==='Cu').reduce((s,i)=>s+S.amt[i],0);S.blueMax=Math.max(S.blueMax,cu);

  if(S.pred&&S.time-S.pred.t0>60)evalPred();}

 /* ---------- model ---------- */
 function deriv(x,z,on,dec){const P=EC_P,d={G:0,H:0,B:0,F:0,S:0,K:0,W:0,N:0},dz={G:0,H:0,B:0,F:0,S:0,K:0,W:0,N:0},c=k=>x[k]>1e-9?z[k]/x[k]:0,nf=x.N/(x.N+P.kN);

  for(const k of ['H','B','F','S','K']){if(!on[k]||x[k]<=0)continue;const pc=P[k];
   for(const j in pc.diet){if(!on[j])continue;const take=pc.a*pc.diet[j]*x[j]*x[k],zt=take*c(j);d[j]-=take;d[k]+=pc.e*take;d.W+=(1-pc.e)*take;dz[j]-=zt;dz[k]+=P.rho*zt;dz.W+=(1-P.rho)*zt;}
   const tox=Math.max(0,c(k)-1)*0.1,death=(pc.m+tox)*x[k]+pc.q*x[k]*x[k];d[k]-=death;d.W+=death;dz[k]-=death*c(k);dz.W+=death*c(k);}

 function sim(x,z,on,dec,days){for(let t=0;t<days*20;t++){const [d,dz]=deriv(x,z,on,dec);for(const k in d){x[k]=Math.max(0,x[k]+d[k]*0.05);z[k]=Math.max(0,z[k]+dz[k]*0.05);}
   for(const k of ['H','B','F','S','K'])if(x[k]<1e-4&&on[k]){x[k]=0;z[k]=0;}}}

 function buildScene(){let g=`<defs><linearGradient id="ec-sky" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#bfe3f7"/><stop offset="1" stop-color="#e8f6ff"/></linearGradient></defs><rect width="640" height="160" fill="url(#ec-sky)"/><rect y="156" width="640" height="204" fill="#cfe9b4"/><path d="M0 160 Q160 140 320 158 T640 152 V170 H0 Z" fill="#b5dc95"/>`;

 function paintScene(){EC_SP.forEach(([k,,,,n])=>{const x0=k==='B'?2.19:S.base[k]||EC_EQ[k],v=S.on[k]?S.x[k]:0,shown=v<=1e-3?0:Math.max(1,Math.min(n,Math.round(n*0.5*v/x0)));

  el.querySelector('[data-spray]').onclick=()=>{const live=['G','H','B','F','S','K'].filter(k=>S.on[k]&&S.x[k]>1e-3);api.predict('Spraying pesticide on the grass',live.map(k=>[k,`Most in the ${EC_NM[k].toLowerCase()}`]),()=>{S.z.G+=4;S.sprayed=true;beep('flash');api.log(`Day ${S.day}: pesticide sprayed on the grass.`);

 function toggle(k){const nm=EC_NM[k];

    if(k===1)api.predict(`The grass holds 100 J. How much of it ends up in the grasshoppers’ bodies?`,[['90','About 90 J'],['50','About 50 J'],['10','About 10 J'],['1','About 1 J']],run);else run();}

C4P.push({id:'c4-2-1',u:2,t:'তোত্তো-চানের অ্যাডভেঞ্চার',a:'তেৎসুকো কুরোয়ানাগি',kind:'গল্প (অনুবাদ)',pg:15,art:'tree',
 sum:'জাপানের তোমোই স্কুলে প্রত্যেক ছেলেমেয়ের নিজের একটা করে গাছ ছিল, যাতে তারা চড়ত। তোত্তো-চানের গাছটা ছিল বেড়ার ধারে। তার বন্ধু ইয়াসুয়াকি-চানের পোলিয়োর জন্য হাতে-পায়ে জোর কম, তাই তার নিজের গাছ ছিল না। একদিন তোত্তো-চান লুকিয়ে বন্ধুকে তার গাছে চড়ার নিমন্ত্রণ জানাল। প্রথমে দারোয়ানের ঘর থেকে আনা মই দিয়ে কাজ হলো না। তখন সে টেনে আনল সিঁড়ির মতো একটা মই, ঘামে ভিজে, ঠেলে টেনে অনেক কষ্টে বন্ধুকে ডালে তুলল। এই প্রথম সে বুঝল, কাজটা যত সহজ ভেবেছিল তত সহজ নয়। শেষে দুই বন্ধু গাছের ডালে বসে টেলিভিশন নামের এক আশ্চর্য বাক্সের গল্প করল, যার ভিতরে নাকি সুমো পালোয়ানদের দেখা যায়।',
 auth:'তেৎসুকো কুরোয়ানাগি (জন্ম ১৯৩৩) জাপানের সবচেয়ে জনপ্রিয় টেলিভিশন-তারকাদের একজন। নিজের ছোটোবেলার স্কুলজীবনের স্মৃতি নিয়ে তিনি লেখেন তোত্তো-চান। তোত্তো-চান কথাটির মানে অনেকটা ছোট্ট খুকু। বইটি ঘিরে আছে এক আদর্শ শিক্ষক আর তাঁর স্কুলের কথা। এই গল্পটি সেই বইয়ের বাংলা অনুবাদের একটি অংশ।',

C4P.push({id:'c4-2-3',u:2,t:'ছেলেবেলার দিনগুলি',a:'পুণ্যলতা চক্রবর্তী',kind:'স্মৃতিকথা',pg:28,art:'dolls',

 sum:'১৮৬৮ সালের ৫ জুন ইংল্যান্ডের ডিভনশায়ারে জন্ম ক্যাপটেন স্কটের। তাঁর পূর্বপুরুষেরা সমুদ্রের কাজে বড়ো বড়ো পদে ছিলেন, তাই ছোটোবেলা থেকেই তিনি জাহাজের কাজ শেখেন। রয়েল জিয়োগ্রাফিক্যাল সোসাইটির আয়োজনে ১৯০১ সালের আগস্টে তিনি ডিসকভারি জাহাজে দক্ষিণমেরুর দিকে যাত্রা করেন। স্কট, স্যাকলটন আর উইলসন কুকুরে টানা শ্লেজে এগোলেন, পথে খাবারের তাঁবু রেখে প্রতিটায় পতাকা গুঁজে দিলেন। ঝড়, খাবারের অভাব আর অসুখে তাঁদের ফিরে আসতে হলো। ১৯১০ সালে টেরানোভা জাহাজে স্কট আবার যাত্রা করলেন। চারজন সঙ্গীকে নিয়ে ১৮ জানুয়ারি দক্ষিণমেরুতে পৌঁছে দেখলেন, কয়েক সপ্তাহ আগেই সেখানে নরওয়ের আমুন্ডসেন পতাকা উড়িয়ে গেছেন। ফেরার পথে ভয়ংকর তুষারঝড়ে, খিদে আর ঠান্ডায় একে একে সবাই মারা গেলেন। পরে উদ্ধারকারী দল স্কটের দেহের সঙ্গে তাঁর ডায়েরিটিও খুঁজে পায়।',

C4P.push({id:'c4-7-1',u:7,t:'বাঘা যতীন',a:'পৃথ্বীন্দ্রনাথ মুখোপাধ্যায়',kind:'জীবনী',pg:123,art:'horse',
 sum:'এ গল্প বিপ্লবী যতীন্দ্রনাথ মুখোপাধ্যায়ের ছোটোবেলার, যাঁর ডাকনাম জ্যোতি। মা শরৎশশী রোজ বিকেলে তাঁকে গড়ুই নদীতে স্নান করাতে নিয়ে যেতেন, শাড়ির এক প্রান্ত ধরিয়ে ঢেউয়ের মধ্যে সাঁতার শেখাতেন। ভোরে মামাদের সঙ্গে জ্যোতি যেত কুস্তির আখড়ায়। ন-মামা অনাথ ছিলেন ব্যায়াম আর ঘোড়ায় চড়ায় পটু, জ্যোতি তাঁর প্রিয় শাগরেদ। ঘোড়ায় চড়ার শখ দেখে মামা তাঁকে একটা টাট্টু ঘোড়া কিনে দেন। বড়োমামা বসন্তকুমার কৃষ্ণনগরে ওকালতি করতেন, রবীন্দ্রনাথ ছিলেন তাঁর মক্কেল ও বন্ধু। একদিন কৃষ্ণনগরের রাস্তায় এক ছুটন্ত ঘোড়ার সামনে একটি শিশু দাঁড়িয়ে কাঁদছিল। জ্যোতি এক লাফে শিশুটি আর ঘোড়ার মাঝে গিয়ে দাঁড়ান, সহিসের হাত থেকে লাগাম নিয়ে ঘোড়াকে বশ করেন। পড়াশোনায় তাঁর মাথা ছিল সাফ, ভালোবাসতেন ফুটবল আর যাত্রা-থিয়েটার।',
 auth:'পৃথ্বীন্দ্রনাথ মুখোপাধ্যায় বাঘা যতীনের জীবন নিয়ে গবেষণা করে লিখেছেন। এই পাঠে আছে বিপ্লবী যতীন্দ্রনাথ মুখোপাধ্যায়ের ছোটোবেলার কথা, যিনি পরে বাঘা যতীন নামে বিখ্যাত হন।',

C4P.push({id:'c4-9-2',u:9,t:'মায়াদ্বীপ',a:'সুনীল গঙ্গোপাধ্যায়',kind:'গল্প',pg:153,art:'island',
 sum:'ছোটোবেলায় লেখক মামাবাড়ি যেতেন নৌকো চেপে। মামাবাড়ির গ্রাম প্রায় সারা বছর জলে ডুবে থাকত, তাই প্রত্যেক বাড়িতে ছিল নিজেদের নৌকো। মামাবাড়ির মাঝি নাদের আলি তাঁদের আনতে আসত। বাতাসি নদী পেরিয়ে পিংলা নদী দিয়ে একঘণ্টা যাওয়ার পর দেখা যেত একটা দ্বীপ। সেখানে ঘরবাড়ি নেই, অনেক গাছ, দূর থেকে চোখে পড়ে একটা বড়ো শিমুলগাছ। জল বাড়লে দ্বীপটা ডুবে যায়, জল কমলে আবার জেগে ওঠে, তাই নাদের আলি তার নাম দিয়েছে মায়াদ্বীপ। ওখানে নামা বারণ, প্রচুর সাপ। নদীতে শুশুক মাথা তুলে আবার ডুবে যায়। একবার ফুলে ভরা শিমুলগাছের কাছে লেখক একটা মুখ দেখেছিলেন, হিরের মতো জ্বলজ্বলে চোখ। সবাই হাসলেও তাঁর আজও দৃঢ় বিশ্বাস, তিনি এক জলকন্যাকে দেখেছিলেন। এখন সেই দ্বীপ পুরোপুরি জলের তলায় চলে গেছে।',
 auth:'সুনীল গঙ্গোপাধ্যায় (১৯৩৪–২০১২) জন্মেছিলেন এখনকার বাংলাদেশের ফরিদপুরে, কিশোর বয়সে কলকাতায় আসেন। তাঁর লেখায় কলকাতার জীবন আর ওপার বাংলার স্মৃতি দুই-ই আছে। নীললোহিত ছদ্মনামেও অনেক বই লিখেছেন। কবিতা, গল্প, উপন্যাস সবেতেই তিনি বিখ্যাত।',
